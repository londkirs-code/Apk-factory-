plugins {
    id 'com.android.application'
}
android {
    namespace 'com.apkfactory.alfon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.apkfactory.alfon'
        minSdk 21
        targetSdk 35
        versionCode 167
        versionName '1.0'
    }
}

// Use the repository's persistent release key for every published APK.
// Without this block Gradle emits an unsigned APK and apksigner verification fails.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
