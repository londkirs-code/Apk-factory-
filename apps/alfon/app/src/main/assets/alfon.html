<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>אלפון חורף תשפ"ה</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; direction: rtl; }

  .header {
    background: linear-gradient(135deg, #1a237e, #283593);
    color: white;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header h1 { font-size: 18px; margin-bottom: 10px; text-align: center; }
  .search-box { display: flex; gap: 8px; align-items: center; }
  #searchInput {
    flex: 1; padding: 10px 14px; border: none; border-radius: 25px;
    font-size: 16px; direction: rtl; outline: none;
  }
  .clear-btn {
    background: rgba(255,255,255,0.2); border: none; color: white;
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
  }
  .clear-btn.visible { display: flex; }

  .stats {
    text-align: center; padding: 8px; font-size: 13px;
    color: #666; background: #e8edf2;
  }

  .contacts-list { padding: 8px; }

  .contact-card {
    background: white; border-radius: 12px; margin-bottom: 8px;
    padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .contact-info { flex: 1; }
  .contact-name { font-size: 16px; font-weight: 600; color: #1a237e; margin-bottom: 4px; }
  .contact-name mark { background: #fff176; border-radius: 3px; padding: 0 2px; }
  .contact-phone { font-size: 14px; color: #555; direction: ltr; text-align: right; display: inline-block; }

  .actions { display: flex; gap: 8px; margin-right: 8px; }
  .btn-call {
    background: #2e7d32; color: white; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; box-shadow: 0 2px 4px rgba(46,125,50,0.4);
  }
  .btn-sms {
    background: #1565c0; color: white; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; box-shadow: 0 2px 4px rgba(21,101,192,0.4);
  }
  .btn-save {
    background: #e65100; color: white; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; box-shadow: 0 2px 4px rgba(230,81,0,0.4);
  }

  .no-results { text-align: center; padding: 40px 20px; color: #888; font-size: 16px; display: none; }
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333; color: white; padding: 10px 20px;
    border-radius: 20px; font-size: 14px; transition: transform 0.3s; z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="header">
  <h1>📖 אלפון חורף תשפ"ה</h1>

let searchTimeout = null;

function normalize(str) {
  return str.replace(/[-\s]/g, '').toLowerCase();
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = escapeHtml(query).replace(/[-\s]/g, '.?');
  try {
    const re = new RegExp('(' + escapedQuery + ')', 'gi');
    return escaped.replace(re, '<mark>$1</mark>');
  } catch(e) { return escaped; }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleSearch(val) {
  clearTimeout(searchTimeout);
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.className = val ? 'clear-btn visible' : 'clear-btn';
  searchTimeout = setTimeout(() => renderList(val.trim()), 150);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').className = 'clear-btn';
  renderList('');
  document.getElementById('searchInput').focus();
}

function renderList(query) {
  const list = document.getElementById('contactsList');
  const noResults = document.getElementById('noResults');
  const stats = document.getElementById('stats');

  let results;
  if (!query) {
    results = CONTACTS;
  } else {
    const normQuery = normalize(query);
    results = CONTACTS.filter(c => {
      return normalize(c.name).includes(normQuery) || normalize(c.phone).includes(normQuery);
    });
  }

  if (results.length === 0) {
    list.innerHTML = '';
    noResults.style.display = 'block';
    stats.textContent = 'לא נמצאו תוצאות';
    return;
  }
  noResults.style.display = 'none';

  const showing = results.length < CONTACTS.length ?
    `מציג ${results.length} מתוך ${CONTACTS.length}` :
    `סה"כ ${CONTACTS.length} אנשי קשר`;
  stats.textContent = showing;

  // מציג את כל הרשימה תמיד
  list.innerHTML = results.map((c, i) => {
    const cleanPhone = c.phone.replace(/[^0-9+]/g,'');
    const nameSafe = c.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const phoneSafe = c.phone.replace(/'/g,"\\'");
    return `
    <div class="contact-card">
      <div class="contact-info">
        <div class="contact-name">${highlightMatch(c.name, query)}</div>
        <div class="contact-phone">${highlightMatch(c.phone, query)}</div>
      </div>
      <div class="actions">
        <a class="btn-call" href="tel:${cleanPhone}" title="התקשר">📞</a>
        <a class="btn-sms" href="sms:${cleanPhone}" title="שלח הודעה">💬</a>
        <a class="btn-save" href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3A${encodeURIComponent(c.name)}%0ATEL%3A${encodeURIComponent(cleanPhone)}%0AEND%3AVCARD" download="${encodeURIComponent(c.name)}.vcf" title="שמור איש קשר">💾</a>
      </div>
    </div>`;
  }).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2500);
}
