plugins {
    id 'com.android.application'
}
android {
    namespace 'org.mishnatyosef.pickup'
    compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; checkReleaseBuilds true }

    defaultConfig {
        applicationId 'org.mishnatyosef.pickup'
        minSdk 19
        targetSdk 35
        versionCode 122
        versionName '2.21'
    }
    // בדיקות יחידה רצות על המחשב (JVM). org.json האמיתי מחליף את הגרסה הריקה של android.jar.
    testOptions { unitTests.returnDefaultValues = true }
    // כיווץ קוד ומשאבים בגרסה החתומה: מסיר קוד שלא בשימוש (בעיקר מ-ZXing) ושומר על APK קטן.
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // סורק QR: רק הקורא של ZXing נשאר ב-APK (R8 מסיר את כל השאר).
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// APK Factory shared signing key: preserve install-over-update compatibility.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
