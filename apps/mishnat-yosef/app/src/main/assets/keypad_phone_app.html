  <style id="app-lock">
    /* ===== נעילת תצוגה כמו אפליקציה ===== */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;              /* הדף עצמו לא זז בכלל */
      overscroll-behavior: none;     /* בלי משיכה / רענון / קפיצה בקצוות */
      background: #f5f5f7;
      -webkit-user-select: none;
      user-select: none;             /* בלי סימון טקסט */
      -webkit-touch-callout: none;   /* בלי תפריט לחיצה ארוכה */
      -webkit-tap-highlight-color: transparent;
    }
    /* הקונטיינר היחיד שגולל - אנכית בלבד, ובעמודת נייד קבועה */
    #root {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 480px;              /* במסך רחב נשאר בתצוגת נייד */
      min-height: 0;
      margin: 0 auto;
      overflow-x: hidden;            /* בלי שוטטות לצדדים */
      overflow-y: auto;              /* גלילה אנכית רק לסיכום שמתחת למכשיר */
      overscroll-behavior: contain;
      touch-action: pan-y;           /* רק החלקה אנכית, בלי זום/הזזה לצדדים */
      -webkit-overflow-scrolling: touch;
    }
    img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
    button { touch-action: manipulation; }
  </style>
