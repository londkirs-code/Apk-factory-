plugins {
    id 'com.android.application'
}
android {
    namespace 'org.mishnatyosef.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.mishnatyosef.mobile'
        minSdk 21
        targetSdk 35
        versionCode 224
        versionName '1.386'
    }
}

// Use the same private keystore for every release so Android can update the installed app.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
