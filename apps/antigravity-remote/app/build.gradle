plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.londkirs.antigravityremote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.londkirs.antigravityremote'
        minSdk 24
        // Like Termux: API 29+ forbids executing files from app storage (W^X), and agy is
        // downloaded at runtime from Google, so the app must target API 28.
        targetSdk 28
        versionCode 6
        versionName '3.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes { release { minifyEnabled false } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    // Termux terminal emulator + view (Apache-2.0): PTY, VT100/xterm emulation and rendering.
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.1'
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.1'
}

// Keep the same APK Factory signing key used by the other applications.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
