plugins { id 'com.android.application' }
android {
    namespace 'il.co.londkirs.netz'
    compileSdk 35
    defaultConfig {
        applicationId 'il.co.londkirs.netz'
        minSdk 21
        targetSdk 35
        versionCode 65
        versionName '1.0'
    }
}
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs { release { storeFile file(System.getenv('APK_SIGNING_STORE_FILE')); storePassword System.getenv('APK_SIGNING_STORE_PASSWORD'); keyAlias System.getenv('APK_SIGNING_KEY_ALIAS'); keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD') } }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
