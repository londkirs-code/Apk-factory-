plugins {
    id 'com.android.application'
}

android {
    namespace 'il.co.botomat.hagaha'
    compileSdk 36
    defaultConfig {
        applicationId 'il.co.botomat.hagaha'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'launch_url', 'https://hagaha.botomat.co.il/app?source=android'
        resValue 'string', 'provider_authority', 'il.co.botomat.hagaha.fileprovider'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}

// Use the persistent APK Factory signing key; never generate a new key for this app.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
