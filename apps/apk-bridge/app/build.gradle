plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.londkirs.apkbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.londkirs.apkbridge'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    packaging {
        resources {
            excludes += ['META-INF/versions/**']
            pickFirsts += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// Bundle the Wi-Fi helper APK (module :wifihelper) into this app's assets.
def helperAssetsDir = "${buildDir}/generated/wifiHelperAssets"
tasks.register('bundleWifiHelper', Copy) {
    dependsOn ':wifihelper:assembleRelease'
    from("${rootDir}/wifihelper/build/outputs/apk/release") {
        include '*.apk'
        rename { 'wifi-helper.apk' }
    }
    into helperAssetsDir
}
android.sourceSets.main.assets.srcDirs += helperAssetsDir
tasks.named('preBuild') { dependsOn 'bundleWifiHelper' }

dependencies {
    // v1.0.7+ fixes the RSA key ClassCastException on Android 8-11 and the BouncyCastle
    // provider shadowing that broke pairing/connection on many devices.
    implementation 'com.github.rhythmcache:adb-kt:v1.0.13'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}

// Use APK Factory's existing signing key when the repository secrets are available.
if (System.getenv('APK_SIGNING_STORE_FILE')) {
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv('APK_SIGNING_STORE_FILE'))
                storePassword System.getenv('APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('APK_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
