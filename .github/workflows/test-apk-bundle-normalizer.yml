name: Test APK Bundle Normalizer

on:
  pull_request:
    paths:
      - "tools/reverse-engineering/prepare-apk-input.py"
      - "tools/reverse-engineering/tests/**"
      - ".github/workflows/test-apk-bundle-normalizer.yml"
  push:
    branches: [main]
    paths:
      - "tools/reverse-engineering/prepare-apk-input.py"
      - "tools/reverse-engineering/tests/**"
      - ".github/workflows/test-apk-bundle-normalizer.yml"

permissions:
  contents: read

jobs:
  test-normalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test APK and split-bundle normalization
        run: python tools/reverse-engineering/tests/test-prepare-apk-input.py
