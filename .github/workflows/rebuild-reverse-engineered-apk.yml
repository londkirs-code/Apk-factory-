name: Rebuild and Sign Reverse-Engineered APK

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Reverse Engineer Android APK run ID"
        required: true
        type: string
      project_slug:
        description: "Slug used by the reverse-engineering workflow"
        required: true
        type: string
      original_cert_sha256:
        description: "Original APK signer SHA-256 fingerprint (optional)"
        required: false
        type: string
      authorization_confirmed:
        description: "I own this app or have explicit permission to modify and rebuild it"
        required: true
        default: false
        type: boolean
      public_artifact_confirmed:
        description: "I understand artifacts are public to viewers of this repository's Actions runs"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: rebuild-reverse-engineered-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build-project:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.authorization_confirmed == true &&
       inputs.public_artifact_confirmed == true) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.user.login == 'londkirs-code' &&
       startsWith(github.event.comment.body, '/rebuild-reconstructed-authorized '))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      original_cert_sha256: ${{ steps.request.outputs.original_cert_sha256 }}
    steps:
      - name: Checkout APK Factory
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and validate rebuild request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_PROJECT_SLUG: ${{ inputs.project_slug }}
          INPUT_ORIGINAL_CERT: ${{ inputs.original_cert_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_RUN_ID="$INPUT_SOURCE_RUN_ID"
            PROJECT_SLUG="$INPUT_PROJECT_SLUG"
            ORIGINAL_CERT="$INPUT_ORIGINAL_CERT"
          else
            read -r COMMAND SOURCE_RUN_ID PROJECT_SLUG ORIGINAL_CERT EXTRA <<< "$COMMENT_BODY"
            [[ "$COMMAND" == "/rebuild-reconstructed-authorized" && -z "$EXTRA" ]] || {
              echo "::error::Use: /rebuild-reconstructed-authorized RUN_ID PROJECT_SLUG [ORIGINAL_CERT_SHA256]"
              exit 1
            }
          fi
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::Source run ID must be numeric."; exit 1; }
          [[ "$PROJECT_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$ ]] || { echo "::error::Project slug must be 1-40 safe characters."; exit 1; }
          if [[ -n "$ORIGINAL_CERT" && ! "$ORIGINAL_CERT" =~ ^([A-Fa-f0-9]{64}|([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2})$ ]]; then
            echo "::error::Certificate fingerprint must be 64 hexadecimal characters, optionally colon-separated."
            exit 1
          fi
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "project_slug=$PROJECT_SLUG"
            echo "source_artifact_name=apk-reverse-engineering-$PROJECT_SLUG"
            echo "original_cert_sha256=$ORIGINAL_CERT"
          } >> "$GITHUB_OUTPUT"
          echo "Rebuild request validated."

      - name: Download previous reverse-engineering workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.source_artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          path: source-workspace

      - name: Verify decoded Apktool project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/source-workspace/apktool-project"
          [[ -s "$PROJECT/apktool.yml" && -s "$PROJECT/AndroidManifest.xml" ]] || {
            echo "::error::apktool.yml or AndroidManifest.xml is missing from the downloaded artifact."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/rebuild-input"
          cp -a "$PROJECT" "$RUNNER_TEMP/rebuild-input/apktool-project"
          echo "PROJECT_DIR=$RUNNER_TEMP/rebuild-input/apktool-project" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Install and verify pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            --output "$HOME/apktool_3.0.3.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $HOME/apktool_3.0.3.jar" | sha256sum --check
          java -jar "$HOME/apktool_3.0.3.jar" --version

      - name: Increment versionCode, rebuild and align APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          bash tools/reverse-engineering/rebuild-apktool-project.sh "$PROJECT_DIR" export
          test -s export/reconstructed-aligned-unsigned.apk
          unzip -t export/reconstructed-aligned-unsigned.apk >/dev/null
          sha256sum export/reconstructed-aligned-unsigned.apk > export/analysis/unsigned-SHA256SUMS.txt

      - name: Upload unsigned APK for isolated signing
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-apk-unsigned-internal
          path: |
            export/reconstructed-aligned-unsigned.apk
            export/analysis/
            export/logs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign-apk:
    needs: build-project
    if: needs.build-project.result == 'success'
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: reconstructed-apk-unsigned-internal
          path: incoming

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          test -s incoming/reconstructed-aligned-unsigned.apk
          unzip -t incoming/reconstructed-aligned-unsigned.apk >/dev/null

      - name: Validate and load existing APK Factory signing key
        shell: bash
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY_BASE64" || -z "$APK_SIGNING_STORE_PASSWORD" ||
                -z "$APK_SIGNING_KEY_ALIAS" || -z "$APK_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more existing APK Factory signing secrets."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/apk-factory-release.jks"
          printf '%s' "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          ALIAS="$(printf '%s' "$APK_SIGNING_KEY_ALIAS" | tr -d '[:space:]')"
          keytool -list -keystore "$KEYSTORE" -storepass "$APK_SIGNING_STORE_PASSWORD" -alias "$ALIAS" >/dev/null
          {
            echo "APK_FACTORY_KEYSTORE=$KEYSTORE"
            echo "APK_FACTORY_KEY_ALIAS=$ALIAS"
            echo "APK_FACTORY_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_FACTORY_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Existing APK Factory key validated."

      - name: Sign, verify and compare original signer
        id: sign
        shell: bash
        env:
          EXPECTED_CERT: ${{ needs.build-project.outputs.original_cert_sha256 }}
        run: |
          set -euo pipefail
          SIGNED="incoming/reconstructed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$APK_FACTORY_KEYSTORE" --ks-key-alias "$APK_FACTORY_KEY_ALIAS" \
            --ks-pass env:APK_FACTORY_STORE_PASSWORD --key-pass env:APK_FACTORY_KEY_PASSWORD \
            --out "$SIGNED" incoming/reconstructed-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED" > incoming/signature.txt
          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' incoming/signature.txt | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -n "$EXPECTED_CERT" && "$ACTUAL_CERT" == "$EXPECTED_CERT" ]]; then
            COMPATIBILITY="true"
          elif [[ -n "$EXPECTED_CERT" ]]; then
            COMPATIBILITY="false"
            echo "::warning::Signer differs from the original certificate; Android will reject this as an in-place update."
          else
            COMPATIBILITY="not-verified"
            echo "::warning::No original signer fingerprint was supplied; update compatibility is unverified."
          fi
          echo "update_compatible=$COMPATIBILITY" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SIGNED" > incoming/badging.txt
          sha256sum "$SIGNED" > incoming/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging incoming/reconstructed-aligned-unsigned.apk > incoming/badging-before-signing.txt
          grep -m1 "^package:" incoming/badging.txt

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-signed-apk
          path: |
            incoming/reconstructed.apk
            incoming/signature.txt
            incoming/badging.txt
            incoming/badging-before-signing.txt
            incoming/SHA256SUMS.txt
            incoming/analysis/
            incoming/logs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Notify rebuild result in APK Factory
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_COMPATIBLE: ${{ steps.sign.outputs.update_compatible }}
        with:
          script: |
            const ok = process.env.STATUS === 'success';
            const compatible = process.env.UPDATE_COMPATIBLE || 'not-verified';
            const body = [
              ok ? '## Reconstructed APK — נבנה ונחתם' : '## Reconstructed APK — הבנייה/חתימה נכשלה',
              '',
              ok ? 'ה־APK נבנה מחדש, נחתם במפתח APK Factory ואומת באמצעות apksigner.' : 'לא פורסם APK חתום; יש לבדוק את הלוגים של הריצה.',
              'תאימות חתימה לעדכון מול המקור: ' + compatible,
              '',
              'Artifact: reconstructed-signed-apk',
              process.env.RUN_URL,
              '',
              'המאגר ציבורי; קובץ ה־APK והתוצרים נגישים למי שיכול לצפות בריצת Actions.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
