name: Build Netz HaChama from source repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-netz-ha-chama.yml"

permissions:
  contents: write

concurrency:
  group: build-netz-ha-chama
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APK Factory
        uses: actions/checkout@v4
        with:
          path: factory
          ref: main
          fetch-depth: 0

      - name: Checkout the exact project supplied by the user
        uses: actions/checkout@v4
        with:
          repository: londkirs-code/-
          ref: main
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate source and build the supplied project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build.gradle.kts
          test -s settings.gradle.kts
          test -s gradle/libs.versions.toml
          echo "Source commit: $(git rev-parse HEAD)"
          gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Publish APK through APK Factory
        working-directory: factory
        shell: bash
        run: |
          set -euo pipefail
          APK="../source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p downloads/netz-ha-chama
          cp "$APK" downloads/netz-ha-chama/app.apk
          cat > downloads/netz-ha-chama/README.md <<'EOF'
          # Netz HaChama APK

          Built by APK Factory directly from https://github.com/londkirs-code/-/tree/main/app
          Build type: debug
          Source branch: main
          EOF
          {
            echo "## Netz HaChama APK"
            echo "- Source repository: https://github.com/londkirs-code/-/tree/main/app"
            echo "- Source commit: $(git -C ../source rev-parse HEAD)"
            echo "- APK size: $(stat -c%s downloads/netz-ha-chama/app.apk) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netz-ha-chama-apk
          path: factory/downloads/netz-ha-chama/app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to APK Factory
        working-directory: factory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/netz-ha-chama/app.apk downloads/netz-ha-chama/README.md
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Build Netz HaChama APK from source repository"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Could not publish APK to APK Factory main"
          exit 1
