name: Build Mishnat Pickup APK

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-mishnat-pickup-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.user.login == 'londkirs-code' &&
       github.event.comment.body == '/build-mishnat-pickup')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest APK Factory main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore independent app source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='build-sources/mishnat-pickup.tar.gz.b64'
          test -s "$ARCHIVE"
          mkdir -p apps/mishnat-pickup
          base64 --decode "$ARCHIVE" | tar -xz --strip-components=1 -C apps/mishnat-pickup
          test -s apps/mishnat-pickup/app/build.gradle
          test -s apps/mishnat-pickup/app/src/main/AndroidManifest.xml
          test -s apps/mishnat-pickup/app/src/main/java/org/mishnatyosef/pickup/MainActivity.java

      - name: Validate existing APK Factory signing key
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY_BASE64" || -z "$APK_SIGNING_STORE_PASSWORD" || -z "$APK_SIGNING_KEY_ALIAS" || -z "$APK_SIGNING_KEY_PASSWORD" ]]; then
            echo '::error::APK Factory signing secrets are missing; refusing to create a new key.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/apk-factory-release.jks"
          test -s "$HOME/.android/apk-factory-release.jks"
          APK_SIGNING_KEY_ALIAS="$(printf '%s' "$APK_SIGNING_KEY_ALIAS" | tr -d '[:space:]')"
          {
            echo "APK_SIGNING_STORE_FILE=$HOME/.android/apk-factory-release.jks"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/.android/apk-factory-release.jks" -storepass "$APK_SIGNING_STORE_PASSWORD" -alias "$APK_SIGNING_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$APK_SIGNING_KEY_ALIAS" -keystore "$HOME/.android/apk-factory-release.jks" \
            -storepass "$APK_SIGNING_STORE_PASSWORD" -keypass "$APK_SIGNING_KEY_PASSWORD" \
            -file "$RUNNER_TEMP/apk-factory-signing-preflight.csr" -noprompt >/dev/null
          rm -f "$RUNNER_TEMP/apk-factory-signing-preflight.csr"
          echo 'Existing APK Factory key and private-key password validated.'

      - name: Check package and increment version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mishnat-pickup
          grep -q 'applicationId .org.mishnatyosef.pickup.' app/build.gradle
          grep -q 'signingConfig signingConfigs.release' app/build.gradle
          CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' app/build.gradle | head -n1)"
          [[ "$CODE" =~ ^[0-9]+$ ]]
          NEXT=$((CODE + 1))
          sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT/" app/build.gradle
          echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
          git diff --check

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_FILE="$APK_SIGNING_STORE_FILE"
          export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_PASSWORD="$APK_SIGNING_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_ALIAS="$APK_SIGNING_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_PASSWORD="$APK_SIGNING_KEY_PASSWORD"
          cd apps/mishnat-pickup
          gradle --build-cache assembleRelease -x lintVitalRelease

      - name: Verify APK manifest and certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/mishnat-pickup/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n1)"
          SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$ANALYZER" && test -n "$SIGNER"
          PACKAGE="$("$ANALYZER" manifest application-id "$APK")"
          CODE="$("$ANALYZER" manifest version-code "$APK")"
          NAME="$("$ANALYZER" manifest version-name "$APK")"
          [[ "$PACKAGE" == 'org.mishnatyosef.pickup' ]]
          [[ "$CODE" == '${{ steps.version.outputs.version_code }}' ]]
          OUTPUT="$("$SIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          CERT="$(printf '%s\n' "$OUTPUT" | grep -i 'SHA-256 digest' | sed -E 's/.*digest:[[:space:]]*//I' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]]
          OLD='downloads/mishnat-pickup/app.apk'
          if [[ -s "$OLD" ]]; then
            OLD_OUTPUT="$("$SIGNER" verify --print-certs "$OLD" 2>&1)"
            OLD_CERT="$(printf '%s\n' "$OLD_OUTPUT" | grep -i 'SHA-256 digest' | sed -E 's/.*digest:[[:space:]]*//I' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            [[ "$CERT" == "$OLD_CERT" ]] || { echo '::error::APK signing certificate differs from the previous publication.'; exit 1; }
          fi
          {
            echo "version_code=$CODE"
            echo "version_name=$NAME"
            echo "certificate=$CERT"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare standalone APK and build metadata
        id: publish
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.certificate }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/mishnat-pickup/history
          cp apps/mishnat-pickup/app/build/outputs/apk/release/app-release.apk downloads/mishnat-pickup/app.apk
          cp downloads/mishnat-pickup/app.apk "downloads/mishnat-pickup/history/mishnat-pickup-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          SHA="$(sha256sum downloads/mishnat-pickup/app.apk | cut -d ' ' -f1)"
          UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > downloads/mishnat-pickup/build-info.txt <<INFO
          app=mishnat-pickup
          workflow_run_id=${RUN_ID}
          run_number=${RUN_NUMBER}
          version_code=${VERSION_CODE}
          version_name=${VERSION_NAME}
          source_sha=${SOURCE_SHA}
          published_utc=${UTC}
          sha256=${SHA}
          signing_certificate_sha256=${CERT}
          apk_path=downloads/mishnat-pickup/app.apk
          INFO
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mishnat-Pickup-signed-APK
          path: downloads/mishnat-pickup/app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Persist increasing version and publish to main
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/mishnat-pickup.tar.gz -C apps/mishnat-pickup .
          base64 -w0 /tmp/mishnat-pickup.tar.gz > build-sources/mishnat-pickup.tar.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-sources/mishnat-pickup.tar.gz.b64 downloads/mishnat-pickup/
          git commit -m "release: publish signed Mishnat Pickup APK ${{ steps.verify.outputs.version_code }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Published signed APK, metadata and updated source archive.'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          echo '::error::Could not publish after 5 attempts.'
          exit 1

      - name: Notify APK Factory subscribers
        if: success()
        uses: actions/github-script@v7
        env:
          ACTOR: ${{ github.actor }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
          SHA: ${{ steps.publish.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              `✅ @${process.env.ACTOR} — אפליקציית איסוף משנת יוסף נבנתה ונחתמה.`,
              '',
              `גרסה: ${process.env.VERSION_NAME} (${process.env.VERSION_CODE})`,
              `SHA-256: ${process.env.SHA}`,
              'הורדת APK: https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/mishnat-pickup/app.apk',
              `[יומן הבנייה](${process.env.RUN_URL})`,
              '',
              '_הבנייה אינה מהווה בדיקת התחברות מול חשבון אמיתי או בדיקת התקנה במכשיר._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
