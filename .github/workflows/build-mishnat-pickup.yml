name: Build Mishnat Pickup APK

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-mishnat-pickup-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.user.login == 'londkirs-code' &&
       github.event.comment.body == '/build-mishnat-pickup')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest APK Factory main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Android SDK 35 and Build Tools 35.0.0 are ready."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify independent app source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/mishnat-pickup-source.tar.gz"
          cat build-sources/mishnat-pickup-source-part-*.b64 | base64 --decode > "$ARCHIVE"
          test -s "$ARCHIVE"
          gzip -t "$ARCHIVE"
          mkdir -p apps/mishnat-pickup
          tar -xzf "$ARCHIVE" --strip-components=1 -C apps/mishnat-pickup
          test -s apps/mishnat-pickup/app/build.gradle
          test -s apps/mishnat-pickup/app/src/main/AndroidManifest.xml
          test -s apps/mishnat-pickup/app/src/main/java/org/mishnatyosef/pickup/MainActivity.java
          echo "Verified compressed source archive and restored all app files."

      - name: Validate existing APK Factory signing key
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APK_SIGNING_KEY_BASE64" ]] || missing+=("APK_SIGNING_KEY_BASE64")
          [[ -n "$APK_SIGNING_STORE_PASSWORD" ]] || missing+=("APK_SIGNING_STORE_PASSWORD")
          [[ -n "$APK_SIGNING_KEY_ALIAS" ]] || missing+=("APK_SIGNING_KEY_ALIAS")
          [[ -n "$APK_SIGNING_KEY_PASSWORD" ]] || missing+=("APK_SIGNING_KEY_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '::error::Missing existing APK Factory signing secret(s): %s. No replacement key will be generated.\n' "${missing[*]}"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/apk-factory-release.jks"
          test -s "$HOME/.android/apk-factory-release.jks"
          APK_SIGNING_KEY_ALIAS="$(printf '%s' "$APK_SIGNING_KEY_ALIAS" | tr -d '[:space:]')"
          {
            echo "APK_SIGNING_STORE_FILE=$HOME/.android/apk-factory-release.jks"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/.android/apk-factory-release.jks" -storepass "$APK_SIGNING_STORE_PASSWORD" -alias "$APK_SIGNING_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$APK_SIGNING_KEY_ALIAS" -keystore "$HOME/.android/apk-factory-release.jks" \
            -storepass "$APK_SIGNING_STORE_PASSWORD" -keypass "$APK_SIGNING_KEY_PASSWORD" \
            -file "$RUNNER_TEMP/apk-factory-signing-preflight.csr" -noprompt >/dev/null
          rm -f "$RUNNER_TEMP/apk-factory-signing-preflight.csr"
          echo "Existing APK Factory keystore and private-key password validated."

      - name: Calculate a strictly increasing version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="apps/mishnat-pickup/app/build.gradle"
          grep -q "applicationId 'org.mishnatyosef.pickup'" "$BUILD_FILE"
          grep -q 'signingConfig signingConfigs.release' "$BUILD_FILE"
          SOURCE_CODE="$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p" "$BUILD_FILE" | head -n1)"
          [[ "$SOURCE_CODE" =~ ^[0-9]+$ ]]
          PREVIOUS_CODE=""
          if [[ -s downloads/mishnat-pickup/build-info.txt ]]; then
            PREVIOUS_CODE="$(sed -n 's/^version_code=//p' downloads/mishnat-pickup/build-info.txt | head -n1)"
          fi
          BASE_CODE="$SOURCE_CODE"
          if [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && (( PREVIOUS_CODE > BASE_CODE )); then
            BASE_CODE="$PREVIOUS_CODE"
          fi
          NEXT_CODE=$((BASE_CODE + 1))
          NEXT_NAME="1.$NEXT_CODE"
          sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT_CODE/" "$BUILD_FILE"
          sed -i -E "0,/versionName[[:space:]]+'[^']+'/s//versionName '$NEXT_NAME'/" "$BUILD_FILE"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEXT_NAME" >> "$GITHUB_OUTPUT"
          echo "Source versionCode=$SOURCE_CODE; previously published=$PREVIOUS_CODE; building=$NEXT_NAME ($NEXT_CODE)."
          git diff --check

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_FILE="$APK_SIGNING_STORE_FILE"
          export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_PASSWORD="$APK_SIGNING_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_ALIAS="$APK_SIGNING_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_PASSWORD="$APK_SIGNING_KEY_PASSWORD"
          cd apps/mishnat-pickup
          gradle --no-daemon --console=plain --stacktrace :app:assembleRelease

      - name: Verify APK package, version and signing certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/mishnat-pickup/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n1)"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -n "$ANALYZER" && test -x "$SIGNER"
          PACKAGE="$("$ANALYZER" manifest application-id "$APK")"
          CODE="$("$ANALYZER" manifest version-code "$APK")"
          NAME="$("$ANALYZER" manifest version-name "$APK")"
          [[ "$PACKAGE" == 'org.mishnatyosef.pickup' ]]
          [[ "$CODE" == "${{ steps.version.outputs.version_code }}" ]]
          [[ "$NAME" == "${{ steps.version.outputs.version_name }}" ]]
          OUTPUT="$("$SIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          CERT="$(printf '%s\n' "$OUTPUT" | grep -i 'SHA-256 digest' | sed -E 's/.*digest:[[:space:]]*//I' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]]
          OLD='downloads/mishnat-pickup/app.apk'
          if [[ -s "$OLD" ]]; then
            OLD_OUTPUT="$("$SIGNER" verify --print-certs "$OLD" 2>&1)"
            OLD_CERT="$(printf '%s\n' "$OLD_OUTPUT" | grep -i 'SHA-256 digest' | sed -E 's/.*digest:[[:space:]]*//I' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            [[ "$CERT" == "$OLD_CERT" ]] || { echo "::error::The new APK signing certificate differs from the previous published APK."; exit 1; }
          fi
          {
            echo "version_code=$CODE"
            echo "version_name=$NAME"
            echo "certificate=$CERT"
          } >> "$GITHUB_OUTPUT"
          echo "APK package, version, signature and certificate continuity checks passed."

      - name: Prepare standalone APK and build metadata
        id: publish
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
          CERT: ${{ steps.verify.outputs.certificate }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/mishnat-pickup/history
          cp apps/mishnat-pickup/app/build/outputs/apk/release/app-release.apk downloads/mishnat-pickup/app.apk
          cp downloads/mishnat-pickup/app.apk "downloads/mishnat-pickup/history/mishnat-pickup-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          SHA="$(sha256sum downloads/mishnat-pickup/app.apk | cut -d ' ' -f1)"
          UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > downloads/mishnat-pickup/build-info.txt <<INFO
          app=mishnat-pickup
          workflow_run_id=${RUN_ID}
          run_number=${RUN_NUMBER}
          version_code=${VERSION_CODE}
          version_name=${VERSION_NAME}
          source_sha=${SOURCE_SHA}
          published_utc=${UTC}
          sha256=${SHA}
          signing_certificate_sha256=${CERT}
          apk_path=downloads/mishnat-pickup/app.apk
          INFO
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mishnat-Pickup-signed-APK
          path: downloads/mishnat-pickup/app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK and metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/mishnat-pickup/
          git commit -m "release: publish signed Mishnat Pickup APK ${{ steps.verify.outputs.version_code }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not safely rebase the APK publication onto main. Retry after inspecting the concurrent main change."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published signed APK and matching metadata."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after fetching main."
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish the signed APK after 5 push attempts."
          exit 1

      - name: Notify APK Factory subscribers
        if: success()
        uses: actions/github-script@v7
        env:
          ACTOR: ${{ github.actor }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
          SHA: ${{ steps.publish.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              `✅ @${process.env.ACTOR} — אפליקציית איסוף משנת יוסף נבנתה ונחתמה.`,
              '',
              `גרסה: ${process.env.VERSION_NAME} (${process.env.VERSION_CODE})`,
              `SHA-256: ${process.env.SHA}`,
              'הורדת APK: https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/mishnat-pickup/app.apk',
              `[יומן הבנייה](${process.env.RUN_URL})`,
              '',
              '_הבנייה אינה מהווה בדיקת התחברות מול חשבון אמיתי או בדיקת התקנה במכשיר._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
