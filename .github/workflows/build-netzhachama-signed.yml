name: Build signed נץ החמה APK using APK Factory key

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-netzhachama-signed.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: netzhachama-signed-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 1 && github.event.comment.body == '/build-netzhachama')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout APK Factory (shared signing configuration)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the current נץ החמה source
        uses: actions/checkout@v4
        with:
          repository: londkirs-code/-
          ref: main
          path: netzhachama
          fetch-depth: 1
          persist-credentials: false

      - name: Skip if this exact source commit was already built
        id: check
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C netzhachama rev-parse HEAD)"
          STATE_FILE="external-build-state/netzhachama.sha"
          PREVIOUS_SHA=""
          if [[ -s "$STATE_FILE" ]]; then PREVIOUS_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"; fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE_SHA" == "$PREVIOUS_SHA" && "${{ github.event_name }}" == "schedule" ]]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "This exact נץ החמה source commit was already built successfully; skipping."
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "A new source commit or manual build requires a signed APK."
          fi

      - name: Set up Java
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate and prepare the existing APK Factory signing key
        if: steps.check.outputs.build_needed == 'true'
        shell: bash
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APK_SIGNING_KEY_BASE64" ] || missing+=("APK_SIGNING_KEY_BASE64")
          [ -n "$APK_SIGNING_STORE_PASSWORD" ] || missing+=("APK_SIGNING_STORE_PASSWORD")
          [ -n "$APK_SIGNING_KEY_ALIAS" ] || missing+=("APK_SIGNING_KEY_ALIAS")
          [ -n "$APK_SIGNING_KEY_PASSWORD" ] || missing+=("APK_SIGNING_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing APK Factory Actions secret(s): %s. Configure them in londkirs-code/Apk-factory-.\n' "${missing[*]}"
            exit 1
          fi

          APK_SIGNING_KEY_ALIAS="$(printf "%s" "$APK_SIGNING_KEY_ALIAS" | tr -d "[:space:]")"
          if ! printf '%s' "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apk-factory-release.jks"; then
            echo "::error::APK_SIGNING_KEY_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/apk-factory-release.jks" ]; then
            echo "::error::The decoded APK Factory keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/apk-factory-release.jks" -storepass "$APK_SIGNING_STORE_PASSWORD" -alias "$APK_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The existing APK Factory keystore/password/alias could not be validated."
            exit 1
          fi
          cp "$RUNNER_TEMP/apk-factory-release.jks" netzhachama/my-upload-key.jks
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/netzhachama/my-upload-key.jks"
            echo "STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          # Honor the validated alias from the existing shared keystore.
          sed -i 's/keyAlias = "upload"/keyAlias = System.getenv("KEY_ALIAS") ?: "upload"/' netzhachama/app/build.gradle.kts

      - name: Set up Android SDK
        if: steps.check.outputs.build_needed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        if: steps.check.outputs.build_needed == 'true'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        if: steps.check.outputs.build_needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Apply AndroidX Fragment compatibility fix
        if: steps.check.outputs.build_needed == 'true'
        working-directory: netzhachama
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'androidx.fragment:fragment-ktx' app/build.gradle.kts; then
            sed -i '/implementation(libs.androidx.activity.compose)/a\  implementation("androidx.fragment:fragment-ktx:1.8.9")' app/build.gradle.kts
          fi
          grep -n 'androidx.fragment:fragment-ktx' app/build.gradle.kts

      - name: Verify AndroidX Fragment runtime version before Release build
        if: steps.check.outputs.build_needed == 'true'
        working-directory: netzhachama
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:dependencyInsight --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath | tee ../fragment-dependency-check.log
          if ! grep -Eq 'androidx[.]fragment:fragment(-ktx)?:1[.][3-9][0-9]*[.][0-9]+' ../fragment-dependency-check.log; then
            echo "::error::AndroidX Fragment resolved version is missing or too old for Activity Result APIs."
            exit 1
          fi

      - name: Set increasing versionCode and build signed Release APK
        id: build
        if: steps.check.outputs.build_needed == 'true'
        working-directory: netzhachama
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NEXT_VERSION_CODE="$((10000 + RUN_NUMBER))"
          echo "version_code=$NEXT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*[0-9]+/    versionCode = $NEXT_VERSION_CODE/" app/build.gradle.kts
          mkdir -p ../export
          gradle --no-daemon --console=plain --stacktrace --info :app:assembleRelease 2>&1 | tee ../export/build.log
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" ../export/NetzHachama.apk
          sha256sum ../export/NetzHachama.apk | tee ../export/SHA256SUMS.txt
          rm -f my-upload-key.jks

      - name: Publish signed APK artifact
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetzHachama-signed-APK
          path: |
            export/NetzHachama.apk
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Preserve build log on failure
        if: failure() && steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetzHachama-build-log
          path: export/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish stable APK, metadata, and source state to repository
        if: steps.check.outputs.build_needed == 'true' && success()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.check.outputs.source_sha }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p downloads external-build-state
          cp export/NetzHachama.apk downloads/NetzHachama.apk
          SHA256="$(sha256sum downloads/NetzHachama.apk | cut -d ' ' -f1)"
          PUBLISHED_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'app=NetzHachama\nworkflow_run_id=%s\nrun_number=%s\nversion_code=%s\nsource_sha=%s\npublished_utc=%s\nsha256=%s\napk_path=downloads/NetzHachama.apk\n' "$RUN_ID" "$RUN_NUMBER" "$VERSION_CODE" "$SOURCE_SHA" "$PUBLISHED_UTC" "$SHA256" > downloads/NetzHachama-build-info.txt
          printf '%s\n' "$SOURCE_SHA" > external-build-state/netzhachama.sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NetzHachama.apk downloads/NetzHachama-build-info.txt external-build-state/netzhachama.sha
          git commit -m "release: publish signed Netz Hachama APK $VERSION_CODE"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then break; fi
            else
              git rebase --abort || true
              echo "::error::Could not rebase APK publication safely; refusing to overwrite main."
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Failed to publish APK after five attempts."; exit 1; fi
            sleep "$((attempt * 2))"
          done
          git fetch origin main
          REMOTE_INFO="$(git show origin/main:downloads/NetzHachama-build-info.txt)"
          grep -Fx "workflow_run_id=$RUN_ID" <<< "$REMOTE_INFO"
          grep -Fx "source_sha=$SOURCE_SHA" <<< "$REMOTE_INFO"
          grep -Fx "version_code=$VERSION_CODE" <<< "$REMOTE_INFO"
          grep -Fx "sha256=$SHA256" <<< "$REMOTE_INFO"
          git cat-file -e origin/main:downloads/NetzHachama.apk
          echo "Published stable APK: https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/NetzHachama.apk"

      - name: Notify APK Factory issue subscribers about the Netz Hachama build
        if: always() && steps.check.outputs.build_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const runUrl = 'https://github.com/londkirs-code/Apk-factory-/actions/runs/${{ github.run_id }}';
            const body = success
              ? ['## נץ החמה — בניית APK הושלמה בהצלחה', '', 'ה־APK החתום פורסם:', 'https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/NetzHachama.apk', '', 'מידע בנייה: https://github.com/londkirs-code/Apk-factory-/blob/main/downloads/NetzHachama-build-info.txt', 'versionCode: ${{ steps.build.outputs.version_code }}', 'source SHA: ${{ steps.check.outputs.source_sha }}', 'ריצת Actions: ' + runUrl].join('\n')
              : ['## נץ החמה — בניית APK נכשלה', '', 'אין להתייחס ל־APK הקיים כחדש. פרטי הכשל:', runUrl].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body });

