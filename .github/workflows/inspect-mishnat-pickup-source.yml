name: Inspect Mishnat Pickup source
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  export-source:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'londkirs-code' &&
      github.event.comment.body == '/inspect-mishnat-pickup-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/mishnat-pickup-source.tar.gz"
          cat build-sources/mishnat-pickup-source-part-*.b64 | base64 --decode > "$ARCHIVE"
          gzip -t "$ARCHIVE"
          mkdir -p apps/mishnat-pickup
          tar -xzf "$ARCHIVE" --strip-components=1 -C apps/mishnat-pickup
          test -s apps/mishnat-pickup/app/src/main/java/org/mishnatyosef/pickup/MainActivity.java
          find apps/mishnat-pickup -type f | sort
      - name: Upload restored source for review
        uses: actions/upload-artifact@v4
        with:
          name: mishnat-pickup-restored-source
          path: apps/mishnat-pickup/
          if-no-files-found: error
          retention-days: 7
