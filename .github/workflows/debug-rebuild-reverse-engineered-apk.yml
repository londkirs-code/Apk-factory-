name: Debug Build from Reverse-Engineered APK

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional direct HTTPS URL to an APK, APKM, XAPK, APKS or ZIP. If supplied, this replaces source_run_id."
        required: false
        type: string
      source_run_id:
        description: "Successful Reverse Engineer Android APK run ID (required only when source_url is empty)"
        required: false
        type: string
      project_slug:
        description: "Safe project name used for the downloaded or previously analyzed app"
        required: true
        default: "reconstructed-app"
        type: string
      original_cert_sha256:
        description: "Original APK signer SHA-256 fingerprint (optional)"
        required: false
        type: string
      authorization_confirmed:
        description: "I own this app or have explicit permission to modify and rebuild it"
        required: true
        default: false
        type: boolean
      public_artifact_confirmed:
        description: "I understand artifacts are public to viewers of this repository's Actions runs"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: debug-rebuild-reverse-engineered-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build-project:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.authorization_confirmed == true &&
       inputs.public_artifact_confirmed == true) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.user.login == 'londkirs-code' &&
       startsWith(github.event.comment.body, '/debug-rebuild-authorized '))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      original_cert_sha256: ${{ steps.source_signer.outputs.original_cert_sha256 || steps.request.outputs.original_cert_sha256 }}
    steps:
      - name: Checkout APK Factory
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and validate rebuild request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_PROJECT_SLUG: ${{ inputs.project_slug }}
          INPUT_ORIGINAL_CERT: ${{ inputs.original_cert_sha256 }}
        run: |
          set -euo pipefail
          SOURCE_URL="$INPUT_SOURCE_URL"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_RUN_ID="$INPUT_SOURCE_RUN_ID"
            PROJECT_SLUG="$INPUT_PROJECT_SLUG"
            ORIGINAL_CERT="$INPUT_ORIGINAL_CERT"
          else
            read -r COMMAND SOURCE_RUN_ID PROJECT_SLUG ORIGINAL_CERT EXTRA <<< "$COMMENT_BODY"
            [[ "$COMMAND" == "/debug-rebuild-authorized" && -z "$EXTRA" ]] || {
              echo "::error::Use: /debug-rebuild-authorized RUN_ID PROJECT_SLUG [ORIGINAL_CERT_SHA256]"
              exit 1
            }
          fi
          if [[ -n "$SOURCE_URL" ]]; then
            python3 - "$SOURCE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          u=urlparse(sys.argv[1])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("Source URL must be HTTPS and must not embed credentials")
          PY
            SOURCE_MODE="url"
          else
            [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::Provide source_url or a numeric source_run_id."; exit 1; }
            SOURCE_MODE="artifact"
          fi
          [[ "$PROJECT_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$ ]] || { echo "::error::Project slug must be 1-40 safe characters."; exit 1; }
          if [[ -n "$ORIGINAL_CERT" && ! "$ORIGINAL_CERT" =~ ^([A-Fa-f0-9]{64}|([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2})$ ]]; then
            echo "::error::Certificate fingerprint must be 64 hexadecimal characters, optionally colon-separated."
            exit 1
          fi
          {
            echo "source_mode=$SOURCE_MODE"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_url=$SOURCE_URL"
            echo "project_slug=$PROJECT_SLUG"
            echo "source_artifact_name=apk-reverse-engineering-$PROJECT_SLUG"
            echo "original_cert_sha256=$ORIGINAL_CERT"
          } >> "$GITHUB_OUTPUT"
          echo "Rebuild request validated."

      - name: Download previous reverse-engineering workspace
        if: steps.request.outputs.source_mode == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.source_artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          path: source-workspace

      - name: Verify decoded Apktool project from previous run
        if: steps.request.outputs.source_mode == 'artifact'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/source-workspace/apktool-project"
          [[ -s "$PROJECT/apktool.yml" && -s "$PROJECT/AndroidManifest.xml" ]] || {
            echo "::error::apktool.yml or AndroidManifest.xml is missing from the downloaded artifact."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/rebuild-input"
          cp -a "$PROJECT" "$RUNNER_TEMP/rebuild-input/apktool-project"
          echo "PROJECT_DIR=$RUNNER_TEMP/rebuild-input/apktool-project" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Install and verify pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            --output "$HOME/apktool_3.0.3.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $HOME/apktool_3.0.3.jar" | sha256sum --check
          java -jar "$HOME/apktool_3.0.3.jar" --version

      - name: Download and normalize direct APK/APKM/XAPK/APKS/ZIP URL
        if: steps.request.outputs.source_mode == 'url'
        shell: bash
        env:
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p source-workspace/download source-workspace/normalized
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' --max-filesize 1073741824 \
            --connect-timeout 20 --max-time 600 "$SOURCE_URL" \
            --output source-workspace/download/source-package
          test -s source-workspace/download/source-package
          python3 tools/reverse-engineering/prepare-apk-input.py \
            source-workspace/download/source-package source-workspace/normalized \
            "$ANDROID_HOME/build-tools/36.0.0/aapt"
          mkdir -p source-workspace/input-apks
          cp -a source-workspace/normalized/splits/. source-workspace/input-apks/
          if [[ -d source-workspace/normalized/obb ]]; then
            cp -a source-workspace/normalized/obb source-workspace/input-obb
          fi
          cat source-workspace/normalized/split-inventory.tsv

      - name: Verify original split signatures and capture source certificate
        id: source_signer
        if: steps.request.outputs.source_mode == 'url'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=""
          for apk in source-workspace/input-apks/*.apk; do
            REPORT="$RUNNER_TEMP/$(basename "$apk").signature.txt"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$REPORT"
            CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$REPORT" | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            [[ "$CERT" =~ ^[A-F0-9]{64}$ ]] || { echo "::error::Could not read a valid signer fingerprint from $(basename "$apk")."; exit 1; }
            if [[ -z "$EXPECTED" ]]; then EXPECTED="$CERT"; fi
            [[ "$CERT" == "$EXPECTED" ]] || { echo "::error::Original split APKs do not share one signing certificate."; exit 1; }
          done
          [[ -n "$EXPECTED" ]] || { echo "::error::No signed APKs were found in the downloaded package."; exit 1; }
          echo "original_cert_sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "All original APK components have valid signatures and share one signer."

      - name: Decode base APK for direct-URL rebuild
        if: steps.request.outputs.source_mode == 'url'
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$HOME/apktool_3.0.3.jar" d --force --all-src \
            -o "$RUNNER_TEMP/rebuild-input/apktool-project" \
            source-workspace/input-apks/base.apk
          test -s "$RUNNER_TEMP/rebuild-input/apktool-project/apktool.yml"
          test -s "$RUNNER_TEMP/rebuild-input/apktool-project/AndroidManifest.xml"
          echo "PROJECT_DIR=$RUNNER_TEMP/rebuild-input/apktool-project" >> "$GITHUB_ENV"

      - name: Rebuild complete APK set and align every component
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          SPLIT_COUNT="$(find source-workspace/input-apks -maxdepth 1 -type f -name '*.apk' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$SPLIT_COUNT" =~ ^[0-9]+$ ]] && (( SPLIT_COUNT > 1 )); then
            bash tools/reverse-engineering/rebuild-split-set.sh source-workspace/input-apks "$PROJECT_DIR" export/split-set
            if [[ -d source-workspace/input-obb ]]; then cp -a source-workspace/input-obb export/split-set/obb; fi
            test "$(find export/split-set/aligned -maxdepth 1 -name '*.apk' | wc -l)" -eq "$SPLIT_COUNT"
            sha256sum export/split-set/aligned/*.apk > export/split-set/analysis/unsigned-SHA256SUMS.txt
            echo "APK_SET_TYPE=split" >> "$GITHUB_ENV"
          else
            bash tools/reverse-engineering/rebuild-apktool-project.sh "$PROJECT_DIR" export
            test -s export/reconstructed-aligned-unsigned.apk
            unzip -t export/reconstructed-aligned-unsigned.apk >/dev/null
            sha256sum export/reconstructed-aligned-unsigned.apk > export/analysis/unsigned-SHA256SUMS.txt
            echo "APK_SET_TYPE=single" >> "$GITHUB_ENV"
          fi

      - name: Upload unsigned APK set for isolated signing
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-unsigned-internal
          path: |
            export/reconstructed-aligned-unsigned.apk
            export/analysis/
            export/logs/
            export/split-set/aligned/
            export/split-set/analysis/
            export/split-set/logs/
            export/split-set/obb/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign-apk:
    needs: build-project
    if: needs.build-project.result == 'success'
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download unsigned APK set
        uses: actions/download-artifact@v4
        with:
          name: debug-apk-unsigned-internal
          path: incoming

      - name: Checkout APK Factory signing scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          if [[ -s incoming/reconstructed-aligned-unsigned.apk ]]; then
            unzip -t incoming/reconstructed-aligned-unsigned.apk >/dev/null
          elif compgen -G "incoming/split-set/aligned/*.apk" >/dev/null; then
            for apk in incoming/split-set/aligned/*.apk; do unzip -t "$apk" >/dev/null; done
          else
            echo "::error::No complete unsigned APK or split set was downloaded."
            exit 1
          fi

      - name: Generate temporary DEBUG keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/apk-factory-debug.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -alias apkfactory-debug -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=APK Factory Temporary Debug,O=Local Testing,C=XX"
          {
            echo "APK_FACTORY_KEYSTORE=$KEYSTORE"
            echo "APK_FACTORY_KEY_ALIAS=apkfactory-debug"
            echo "APK_FACTORY_STORE_PASSWORD=$STORE_PASS"
            echo "APK_FACTORY_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "Generated an ephemeral DEBUG key for this run only."

      - name: Sign, verify and compare original signer
        id: sign
        shell: bash
        env:
          EXPECTED_CERT: ${{ needs.build-project.outputs.original_cert_sha256 }}
        run: |
          set -euo pipefail
          if compgen -G "incoming/split-set/aligned/*.apk" >/dev/null; then
            bash tools/reverse-engineering/sign-split-set.sh incoming/split-set/aligned incoming/split-set/output "$EXPECTED_CERT"
            mv incoming/split-set/output/reconstructed-signed-split-set.zip incoming/split-set/output/debug-signed-split-set.zip
            COMPATIBILITY="$(sed -n 's/^original_signer_match=//p' incoming/split-set/output/analysis/split-signing-result.txt)"
            cp incoming/split-set/output/analysis/split-signing-result.txt incoming/split-set/output/signature-summary.txt
            echo "Split set signed and verified. Original signer match: $COMPATIBILITY"
          else
            SIGNED="incoming/debug.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$APK_FACTORY_KEYSTORE" --ks-key-alias "$APK_FACTORY_KEY_ALIAS" \
              --ks-pass env:APK_FACTORY_STORE_PASSWORD --key-pass env:APK_FACTORY_KEY_PASSWORD \
              --out "$SIGNED" incoming/reconstructed-aligned-unsigned.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED" > incoming/signature.txt
            ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' incoming/signature.txt | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            NORMALIZED_EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ -n "$NORMALIZED_EXPECTED" && "$ACTUAL_CERT" == "$NORMALIZED_EXPECTED" ]]; then
              COMPATIBILITY="true"
            elif [[ -n "$NORMALIZED_EXPECTED" ]]; then
              COMPATIBILITY="false"
              echo "::warning::Signer differs from the original certificate; Android will reject this as an in-place update."
            else
              COMPATIBILITY="not-verified"
              echo "::warning::No original signer fingerprint was supplied; update compatibility is unverified."
            fi
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SIGNED" > incoming/badging.txt
            sha256sum "$SIGNED" > incoming/SHA256SUMS.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging incoming/reconstructed-aligned-unsigned.apk > incoming/badging-before-signing.txt
            grep -m1 "^package:" incoming/badging.txt
          fi
          echo "update_compatible=$COMPATIBILITY" >> "$GITHUB_OUTPUT"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-reconstructed-apk
          path: |
            incoming/debug.apk
            incoming/signature.txt
            incoming/badging.txt
            incoming/badging-before-signing.txt
            incoming/SHA256SUMS.txt
            incoming/analysis/
            incoming/logs/
            incoming/split-set/output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Notify rebuild result in APK Factory
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_COMPATIBLE: ${{ steps.sign.outputs.update_compatible }}
        with:
          script: |
            const ok = process.env.STATUS === 'success';
            const compatible = process.env.UPDATE_COMPATIBLE || 'not-verified';
            const body = [
              ok ? '## Reconstructed APK — נבנה ונחתם' : '## Reconstructed APK — הבנייה/חתימה נכשלה',
              '',
              ok ? 'ה־APK נבנה מחדש, נחתם במפתח DEBUG זמני שנוצר לריצה זו ואומת באמצעות apksigner.' : 'לא פורסם APK חתום; יש לבדוק את הלוגים של הריצה.',
              'חתימת DEBUG זמנית: אינה תואמת לעדכון מעל האפליקציה המקורית. בדיקת התאמה מול המקור אינה רלוונטית: ' + compatible,
              '',
              'Artifact: debug-reconstructed-apk',
              process.env.RUN_URL,
              '',
              'המאגר ציבורי; קובץ ה־APK והתוצרים נגישים למי שיכול לצפות בריצת Actions.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
