name: Reverse Engineer Hamazkir

on:
  workflow_dispatch:
    inputs:
      authorization_confirmed:
        description: "I own this APK or have explicit permission to analyze and modify it"
        required: true
        default: false
        type: boolean
      public_artifact_confirmed:
        description: "I understand the analysis artifact will be publicly downloadable"
        required: true
        default: false
        type: boolean
      run_mobsf:
        description: "Run optional MobSF static security analysis"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  reverse-engineer-hamazkir:
    if: inputs.authorization_confirmed == true && inputs.public_artifact_confirmed == true
    uses: ./.github/workflows/reverse-engineer-apk.yml
    with:
      apk_url: "https://gitlab.com/yossi2053/azless-releases/-/raw/main/hamazkir.apk"
      project_slug: "hamazkir"
      authorization_confirmed: ${{ inputs.authorization_confirmed }}
      public_artifact_confirmed: ${{ inputs.public_artifact_confirmed }}
      run_mobsf: ${{ inputs.run_mobsf }}
