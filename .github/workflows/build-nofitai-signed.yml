name: Build signed nofitAI APK using APK Factory key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nofitai-signed.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: nofitai-signed-build-diagnostics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout APK Factory (shared signing configuration)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the current nofitAI fork
        uses: actions/checkout@v4
        with:
          repository: londkirs-code/nofitAI
          ref: main
          path: nofitAI
          fetch-depth: 1
          persist-credentials: false

      - name: Skip if repository APK is newer than source and matches its commit
        id: check
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C nofitAI rev-parse HEAD)"
          SOURCE_TIMESTAMP="$(git -C nofitAI show -s --format=%ct HEAD)"
          STATE_FILE="external-build-state/nofitAI.sha"
          INFO_FILE="downloads/NotifAI-build-info.txt"
          APK_FILE="downloads/NotifAI.apk"
          PREVIOUS_SHA=""
          INFO_SHA=""
          APK_COMMIT_TIMESTAMP=0

          if [[ -s "$STATE_FILE" ]]; then PREVIOUS_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"; fi
          if [[ -s "$INFO_FILE" ]]; then
            INFO_SHA="$(sed -n 's/^source_sha=//p' "$INFO_FILE" | head -n 1 | tr -d '[:space:]')"
          fi
          if [[ -s "$APK_FILE" ]]; then
            APK_COMMIT_TIMESTAMP="$(git log -1 --format=%ct -- "$APK_FILE" || echo 0)"
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_timestamp=$SOURCE_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "APK last repository modification timestamp: $APK_COMMIT_TIMESTAMP"
          echo "Latest source commit timestamp: $SOURCE_TIMESTAMP"

          if [[ -s "$APK_FILE" && "$APK_COMMIT_TIMESTAMP" -gt "$SOURCE_TIMESTAMP" && "$INFO_SHA" == "$SOURCE_SHA" && "$PREVIOUS_SHA" == "$SOURCE_SHA" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "The standalone APK is newer than the source commit and metadata confirms this exact source SHA was built. Skipping build."
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "No verified up-to-date repository APK; a new signed build is required."
          fi

      - name: Set up Java
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Fail fast before downloading Android SDK packages or installing Gradle.
      - name: Validate and prepare the existing APK Factory signing key
        if: steps.check.outputs.build_needed == 'true'
        shell: bash
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APK_SIGNING_KEY_BASE64" ] || missing+=("APK_SIGNING_KEY_BASE64")
          [ -n "$APK_SIGNING_STORE_PASSWORD" ] || missing+=("APK_SIGNING_STORE_PASSWORD")
          [ -n "$APK_SIGNING_KEY_ALIAS" ] || missing+=("APK_SIGNING_KEY_ALIAS")
          [ -n "$APK_SIGNING_KEY_PASSWORD" ] || missing+=("APK_SIGNING_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing APK Factory Actions secret(s): %s. The key must be configured in londkirs-code/Apk-factory- (not only in the nofitAI repository).\n' "${missing[*]}"
            exit 1
          fi

          APK_SIGNING_KEY_ALIAS="$(printf "%s" "$APK_SIGNING_KEY_ALIAS" | tr -d "[:space:]")"
          if ! printf '%s' "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apk-factory-release.jks"; then
            echo "::error::APK_SIGNING_KEY_BASE64 is not valid Base64. Copy the complete value from APK_SIGNING_KEY_BASE64.txt without a sha256: prefix."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/apk-factory-release.jks" ]; then
            echo "::error::The decoded APK Factory keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/apk-factory-release.jks" -storepass "$APK_SIGNING_STORE_PASSWORD" -alias "$APK_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The APK Factory keystore could not be opened with this password/alias. Check the existing APK Factory signing secrets."
            exit 1
          fi
          cp "$RUNNER_TEMP/apk-factory-release.jks" nofitAI/my-upload-key.jks
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/nofitAI/my-upload-key.jks"
            echo "STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Existing APK Factory signing key validated."

          # Honor the existing validated alias without replacing the signing key.
          sed -i 's/keyAlias = "upload"/keyAlias = System.getenv("KEY_ALIAS") ?: "upload"/' nofitAI/app/build.gradle.kts

      - name: Set up Android SDK
        if: steps.check.outputs.build_needed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        if: steps.check.outputs.build_needed == 'true'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        if: steps.check.outputs.build_needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Apply AndroidX Fragment compatibility fix
        if: steps.check.outputs.build_needed == 'true'
        working-directory: nofitAI
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'androidx.fragment:fragment-ktx' app/build.gradle.kts; then
            sed -i '/implementation(libs.androidx.activity.compose)/a\  implementation("androidx.fragment:fragment-ktx:1.8.9")' app/build.gradle.kts
          fi
          grep -n 'androidx.fragment:fragment-ktx' app/build.gradle.kts

      - name: Verify AndroidX Fragment runtime version before Release build
        if: steps.check.outputs.build_needed == 'true'
        working-directory: nofitAI
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:dependencyInsight --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath | tee ../fragment-dependency-check.log
          if ! grep -Eq 'androidx[.]fragment:fragment(-ktx)?:1[.][3-9][0-9]*[.][0-9]+' ../fragment-dependency-check.log; then
            echo "::error::AndroidX Fragment resolved version is missing or older than the minimum required by Activity Result APIs. Refusing to start Release lint/build."
            exit 1
          fi

      - name: Set increasing versionCode and build signed Release APK
        if: steps.check.outputs.build_needed == 'true'
        working-directory: nofitAI
        env:
          NEXT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*[0-9]+/    versionCode = $NEXT_VERSION_CODE/" app/build.gradle.kts
          mkdir -p ../export
          gradle --no-daemon --console=plain --stacktrace --info :app:assembleRelease 2>&1 | tee ../export/build.log
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" ../export/NotifAI.apk
          sha256sum ../export/NotifAI.apk | tee ../export/SHA256SUMS.txt
          rm -f my-upload-key.jks

      - name: Publish signed APK artifact
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NotifAI-signed-APK
          path: |
            export/NotifAI.apk
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish standalone APK to repository
        if: steps.check.outputs.build_needed == 'true' && success()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.check.outputs.source_sha }}
          SOURCE_TIMESTAMP: ${{ steps.check.outputs.source_timestamp }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s export/NotifAI.apk
          mkdir -p downloads external-build-state
          cp export/NotifAI.apk downloads/NotifAI.apk
          CHECKSUM="$(sha256sum downloads/NotifAI.apk | awk '{print $1}')"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_commit_timestamp=$SOURCE_TIMESTAMP"
            echo "version_code=$VERSION_CODE"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "sha256=$CHECKSUM"
            echo "published_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > downloads/NotifAI-build-info.txt
          printf '%s\n' "$SOURCE_SHA" > external-build-state/nofitAI.sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NotifAI.apk downloads/NotifAI-build-info.txt external-build-state/nofitAI.sha
          git commit -m "release: publish latest signed NotifAI APK (source $SOURCE_SHA)"
          git push origin HEAD:main

      - name: Preserve build log on failure
        if: failure() && steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NotifAI-build-log
          path: export/build.log
          if-no-files-found: ignore
          retention-days: 7

# The APK is published as a standalone tracked file at downloads/NotifAI.apk.
# Its stable direct-download URL is https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/NotifAI.apk.
# Scheduled checks run every 15 minutes; if the current source SHA already matches the published APK metadata and its repository timestamp is newer, they skip the build.

# Trigger a fresh signed NotifAI build after validating the stable APK was missing.
