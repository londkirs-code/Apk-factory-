name: Validate Monopoly Android
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/monopoly/**"
      - ".github/workflows/validate-monopoly.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Run unit tests and assemble debug APK
        working-directory: apps/monopoly
        run: gradle --no-daemon testDebugUnitTest assembleDebug
