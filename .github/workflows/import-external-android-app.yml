name: Import and Build External Android App

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository in owner/name format"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      project_path:
        description: "Relative path to Android project (use . for repository root)"
        required: true
        default: "."
        type: string
      gradle_version:
        description: "Gradle version used when the project has no wrapper"
        required: true
        default: "9.3.1"
        type: string
      build_task:
        description: "Gradle task to build"
        required: true
        default: "assembleDebug"
        type: string
      apk_path:
        description: "Expected APK path relative to project directory"
        required: true
        default: "app/build/outputs/apk/debug/app-debug.apk"
        type: string

permissions:
  contents: read

concurrency:
  group: external-android-import-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate import parameters
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          PROJECT_PATH: ${{ inputs.project_path }}
          GRADLE_VERSION: ${{ inputs.gradle_version }}
          BUILD_TASK: ${{ inputs.build_task }}
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Repository must be owner/name."; exit 1; }
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::Invalid source ref."; exit 1; }
          [[ "$PROJECT_PATH" != /* && "$PROJECT_PATH" != *".."* ]] || { echo "::error::Project path must be relative and must not contain '..'."; exit 1; }
          [[ "$GRADLE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Gradle version must be numeric."; exit 1; }
          [[ "$BUILD_TASK" =~ ^[A-Za-z0-9:_-]+$ ]] || { echo "::error::Invalid Gradle task."; exit 1; }
          [[ "$APK_PATH" != /* && "$APK_PATH" != *".."* ]] || { echo "::error::APK path must be relative and must not contain '..'."; exit 1; }

      - name: Check source repository access
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$SOURCE_REPOSITORY"
          if [[ -n "$SOURCE_TOKEN" ]]; then
            HTTP_CODE="$(curl -sS -o "$RUNNER_TEMP/source-repo.json" -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $SOURCE_TOKEN" "$API_URL")"
          else
            HTTP_CODE="$(curl -sS -o "$RUNNER_TEMP/source-repo.json" -w '%{http_code}' -H "Accept: application/vnd.github+json" "$API_URL")"
          fi
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Cannot read '$SOURCE_REPOSITORY' (HTTP $HTTP_CODE). Check its name/visibility and SOURCE_REPO_TOKEN permissions."
            cat "$RUNNER_TEMP/source-repo.json"
            exit 1
          fi
          PRIVATE="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("private", True)).lower())' "$RUNNER_TEMP/source-repo.json")"
          if [[ "$PRIVATE" == "true" && -z "$SOURCE_TOKEN" ]]; then
            echo "::error::The source repository is private; configure SOURCE_REPO_TOKEN with read access."
            exit 1
          fi
          echo "Source repository access verified."

      - name: Checkout external app source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: external-source
          fetch-depth: 1
          persist-credentials: false

      - name: Detect project and Android SDK
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/external-source/$PROJECT_PATH"
          [[ -d "$PROJECT" ]] || { echo "::error::Project directory not found: $PROJECT_PATH"; exit 1; }
          [[ -f "$PROJECT/settings.gradle" || -f "$PROJECT/settings.gradle.kts" || -f "$PROJECT/build.gradle" || -f "$PROJECT/build.gradle.kts" ]] || {
            echo "::error::No Gradle project files found. This workflow supports native Android Gradle projects.";
            exit 1;
          }
          if [[ -f "$PROJECT/gradlew" ]]; then
            chmod +x "$PROJECT/gradlew"
            echo "runner=wrapper" >> "$GITHUB_OUTPUT"
          else
            echo "runner=installed" >> "$GITHUB_OUTPUT"
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          python3 - "$PROJECT" "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          from pathlib import Path
          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          gradle_files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))
          gradle_files = [p for p in gradle_files if "build" not in p.parts and ".gradle" not in p.parts]
          source = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in gradle_files)
          match = re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?(\d+)", source)
          if not match:
              raise SystemExit("::error::Could not detect a numeric compileSdk declaration.")
          with output.open("a", encoding="utf-8") as f:
              f.write(f"platform_package=platforms;android-{int(match.group(1))}\n")
          print(f"Detected Android API {match.group(1)}.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        env:
          PLATFORM_PACKAGE: ${{ steps.project.outputs.platform_package }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          [[ -x "$SDKMANAGER" ]] || { echo "::error::Android SDK manager not found under $SDK_ROOT."; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools "$PLATFORM_PACKAGE"

      - name: Set up Gradle when wrapper is absent
        if: steps.project.outputs.runner == 'installed'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Build imported Android app
        shell: bash
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          RUNNER_KIND: ${{ steps.project.outputs.runner }}
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [[ "$RUNNER_KIND" == "wrapper" ]]; then
            ./gradlew --no-daemon --stacktrace "$BUILD_TASK"
          else
            gradle --no-daemon --stacktrace "$BUILD_TASK"
          fi

      - name: Validate and upload APK
        shell: bash
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -euo pipefail
          APK="$PROJECT/$APK_PATH"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected APK is missing or empty: $APK_PATH"
            find "$PROJECT" -path '*/build/outputs/apk/*.apk' -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p export
          cp "$APK" export/app.apk
          sha256sum export/app.apk | tee export/SHA256SUMS.txt
          ls -lh export/app.apk

      - name: Upload imported APK
        uses: actions/upload-artifact@v4
        with:
          name: imported-android-app-apk
          path: |
            export/app.apk
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
