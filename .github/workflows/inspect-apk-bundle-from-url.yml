name: Inspect Android APK Bundle from URL

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct HTTPS URL to APK/APKM/XAPK/APKS/ZIP"
        required: true
        type: string
      project_slug:
        description: "Safe label for this inspection"
        required: false
        default: chatgpt-inspection
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: inspect-apk-url-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.user.login == 'londkirs-code' &&
       startsWith(github.event.comment.body, '/inspect-split-url '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout APK Factory tools
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Parse request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_URL: ${{ inputs.source_url }}
          INPUT_SLUG: ${{ inputs.project_slug }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            URL="$INPUT_URL"
            SLUG="$INPUT_SLUG"
          else
            read -r COMMAND URL SLUG EXTRA <<< "$COMMENT_BODY"
            [[ "$COMMAND" == "/inspect-split-url" && -z "${EXTRA:-}" ]] || {
              echo "::error::Usage: /inspect-split-url HTTPS_URL [PROJECT_SLUG]"
              exit 1
            }
            SLUG="${SLUG:-apk-inspection}"
          fi
          python3 - "$URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          u=urlparse(sys.argv[1])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("A direct HTTPS URL without embedded user credentials is required")
          PY
          [[ "$SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$ ]] || { echo "::error::Invalid project slug"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Request accepted; URL itself will not be printed."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Download and extract bundle
        shell: bash
        env:
          SOURCE_URL: ${{ steps.request.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p inspection/download inspection/normalized inspection/report
          curl --fail --location --silent --show-error --retry 2 \
            --proto '=https' --proto-redir '=https' --max-filesize 1073741824 \
            --connect-timeout 20 --max-time 600 "$SOURCE_URL" \
            --output inspection/download/source-package
          test -s inspection/download/source-package
          python3 tools/reverse-engineering/prepare-apk-input.py \
            inspection/download/source-package inspection/normalized \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" | tee inspection/report/extraction.txt
          cp inspection/normalized/split-inventory.tsv inspection/report/
          if [[ -f inspection/normalized/bundle-manifest.json ]]; then
            cp inspection/normalized/bundle-manifest.json inspection/report/
          fi
          printf 'download_bytes=%s\n' "$(stat -c%s inspection/download/source-package)" > inspection/report/download-info.txt
          sha256sum inspection/download/source-package > inspection/report/source-SHA256SUMS.txt

      - name: Inspect APK metadata and original signatures
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          : > inspection/report/apk-details.txt
          : > inspection/report/apk-signatures.txt
          for apk in inspection/normalized/splits/*.apk; do
            {
              echo "===== $(basename "$apk") ====="
              "$AAPT" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|launchable-activity:|uses-permission:)" || true
              echo "SHA256:"
              sha256sum "$apk"
            } >> inspection/report/apk-details.txt
            {
              echo "===== $(basename "$apk") ====="
              "$APKSIGNER" verify --verbose --print-certs "$apk"
            } >> inspection/report/apk-signatures.txt
          done
          {
            echo "# APK bundle inspection"
            echo
            echo "- This is static package inspection only."
            echo "- No source-code decompilation, modification, re-signing, or APK publication was performed."
            echo "- Original APK files are not included in the report artifact."
            echo
            echo "## Extracted components"
            cat inspection/report/split-inventory.tsv
            echo
            echo "## Package metadata"
            cat inspection/report/apk-details.txt
            echo
            echo "## Original signature verification"
            cat inspection/report/apk-signatures.txt
            echo
            echo "## Download integrity"
            cat inspection/report/download-info.txt inspection/report/source-SHA256SUMS.txt
          } > inspection/report/REPORT.md

      - name: Upload text-only inspection report
        uses: actions/upload-artifact@v4
        with:
          name: apk-bundle-inspection-${{ steps.request.outputs.slug }}
          path: inspection/report/
          if-no-files-found: error
          retention-days: 14

      - name: Publish result to APK Factory issue
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLUG: ${{ steps.request.outputs.slug }}
        with:
          script: |
            const ok = process.env.STATUS === 'success';
            const body = [
              ok ? '## בדיקת חבילת APK הסתיימה' : '## בדיקת חבילת APK נכשלה',
              '',
              ok ? 'דוח חילוץ, רכיבי Split, מטא-נתונים וחתימות נוצר בהצלחה.' : 'יש לעיין בלוגים כדי לזהות את סיבת הכשל.',
              'הועלה דוח טקסט בלבד; קובצי ה-APK עצמם לא פורסמו.',
              '',
              'Artifact: apk-bundle-inspection-' + (process.env.SLUG || 'apk-inspection'),
              process.env.RUN_URL
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
