name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/, or all"
        required: true
        default: "all"
        type: string
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build selected app or all apps
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_APP" != "all" ]]; then
            [[ "$REQUESTED_APP" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "Invalid app id"; exit 1; }
            [[ -f "apps/$REQUESTED_APP/app/build.gradle" ]] || { echo "App not found: $REQUESTED_APP"; exit 1; }
            APPS=("$REQUESTED_APP")
          else
            mapfile -t APPS < <(find apps -mindepth 1 -maxdepth 1 -type d -print | sort | while read -r d; do [[ -f "$d/app/build.gradle" ]] && basename "$d"; done)
          fi
          if [[ ${#APPS[@]} -eq 0 ]]; then echo "No Android apps found under apps/"; exit 1; fi
          for app in "${APPS[@]}"; do
            echo "::group::Building $app"
            (cd "apps/$app" && gradle --no-daemon assembleDebug)
            mkdir -p "downloads/$app"
            cp "apps/$app/app/build/outputs/apk/debug/"*.apk "downloads/$app/app-debug.apk"
            printf 'APK for %s, built from commit %s.\n' "$app" "$GITHUB_SHA" > "downloads/$app/README.md"
            echo "::endgroup::"
          done
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: downloads/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit APKs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if ! git diff --cached --quiet; then
            git commit -m "Build: update Android APK downloads"
            git push
          fi
