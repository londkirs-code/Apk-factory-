name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/, or all"
        required: true
        default: "all"
        type: string
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "templates/**"
      - "scripts/**"
      - "gradle/**"
      - "buildSrc/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  issues: write

# Prevent overlapping builds from racing while committing APKs and versionCode updates.
concurrency:
  group: apk-factory-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued build must use the latest branch tip, not an older push's commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Determine apps to build
        id: scope
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ALL_APPS=()
          mapfile -t ALL_APPS < <(find apps -mindepth 1 -maxdepth 1 -type d -print | sort | while read -r d; do [[ -f "$d/app/build.gradle" ]] && basename "$d"; done)
          if [[ "${#ALL_APPS[@]}" -eq 0 ]]; then
            echo "::error::No Android apps found under apps/"
            exit 1
          fi

          APPS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_APP" != "all" ]]; then
            [[ "$REQUESTED_APP" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "::error::Invalid app id"; exit 1; }
            [[ -f "apps/$REQUESTED_APP/app/build.gradle" ]] || { echo "::error::App not found: $REQUESTED_APP"; exit 1; }
            APPS=("$REQUESTED_APP")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE="$EVENT_BEFORE"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            SHARED_CHANGE=false
            declare -A TOUCHED_APPS=()
            if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"; then
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                case "$path" in
                  templates/*|scripts/*|gradle/*|buildSrc/*|build.gradle|settings.gradle|gradle.properties|.github/workflows/*)
                    SHARED_CHANGE=true
                    ;;
                  apps/*/*)
                    app="${path#apps/}"
                    app="${app%%/*}"
                    TOUCHED_APPS["$app"]=1
                    ;;
                esac
              done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
            else
              echo "::warning::Could not determine changed files safely; building all apps."
              SHARED_CHANGE=true
            fi
            if [[ "$SHARED_CHANGE" == true || "${#TOUCHED_APPS[@]}" -eq 0 ]]; then
              APPS=("${ALL_APPS[@]}")
            else
              while IFS= read -r app; do APPS+=("$app"); done < <(printf '%s\n' "${!TOUCHED_APPS[@]}" | sort)
            fi
          else
            APPS=("${ALL_APPS[@]}")
          fi

          BUILD_MISHNAT=false
          {
            echo "apps<<EOF"
            printf '%s\n' "${APPS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          for app in "${APPS[@]}"; do
            BUILD_FILE="apps/$app/app/build.gradle"
            CODE="$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p" "$BUILD_FILE" | head -n1)"
            if [[ ! "$CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Missing numeric versionCode in $BUILD_FILE"
              exit 1
            fi
            if [[ "$app" == "mishnat-yosef" ]]; then
              NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\1/p" "$BUILD_FILE" | head -n1)"
              if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]{1,4}$ ]]; then
                echo "::error::Unsupported Mishnat Yosef versionName format: $NAME"
                exit 1
              fi
              test -s apps/mishnat-yosef/RELEASE_NOTES.md || { echo "::error::Missing Mishnat Yosef release notes"; exit 1; }
              BUILD_MISHNAT=true
            fi
          done
          echo "build_mishnat=$BUILD_MISHNAT" >> "$GITHUB_OUTPUT"
          echo "Selected apps: ${APPS[*]}"
          echo "build_mishnat=$BUILD_MISHNAT"

      - name: Prepare persistent signing key
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY_BASE64" || -z "$APK_SIGNING_STORE_PASSWORD" || -z "$APK_SIGNING_KEY_ALIAS" || -z "$APK_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing. Follow the one-time setup in README.md before building APKs."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/apk-factory-release.jks"
          test -s "$HOME/.android/apk-factory-release.jks"
          # Normalize accidental whitespace in the alias secret before Gradle uses it.
          APK_SIGNING_KEY_ALIAS="$(printf "%s" "$APK_SIGNING_KEY_ALIAS" | tr -d "[:space:]")"
          {
            echo "APK_SIGNING_STORE_FILE=$HOME/.android/apk-factory-release.jks"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured."
      - name: Check app changelog coverage
        if: github.event_name == 'push'
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$EVENT_BEFORE"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          TARGET="$(git rev-parse HEAD)"
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$BASE" "$TARGET"; then
            echo "::warning::Cannot determine the exact pushed range; skipping changelog coverage check."
            exit 0
          fi

          mapfile -t CHANGED_PATHS < <(git diff --name-only "$BASE" "$TARGET")
          declare -A TOUCHED_APPS=()
          declare -A LOG_CHANGED=()
          for path in "${CHANGED_PATHS[@]}"; do
            if [[ "$path" =~ ^apps/([^/]+)/.+ ]]; then
              app="${BASH_REMATCH[1]}"
              TOUCHED_APPS["$app"]=1
              if [[ "$path" == "apps/$app/CHANGELOG.md" ]]; then
                LOG_CHANGED["$app"]=1
              fi
            fi
          done

          for app in "${!TOUCHED_APPS[@]}"; do
            if [[ -z "${LOG_CHANGED[$app]+yes}" ]]; then
              echo "::warning::No changelog entry was included in this push for $app. Continuing without creating or pushing a fallback commit, to avoid races with a separate changelog update."
            else
              echo "Found a changelog update for $app in the pushed range."
            fi
          done
          echo "Changelog coverage check completed; it does not modify Git history."
      - name: Update Mishnat Yosef launcher icon from public Dropbox folder
        if: steps.scope.outputs.build_mishnat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREP_START=$(date +%s)
          ICON_DIR="apps/mishnat-yosef/app/src/main/res/drawable"
          ZIP_FILE="$RUNNER_TEMP/mishnat-yosef-dropbox.zip"
          python3 -m pip install --quiet Pillow
          curl --fail --location --silent --show-error \
            "https://www.dropbox.com/scl/fo/rlmu5y694scuiay6340ss/AFQpDACLIS_9DRr_MTxbQ_k?rlkey=qky6haq351wfkxr9z2nekrih7&dl=1" \
            --output "$ZIP_FILE"
          python3 - "$ZIP_FILE" "$ICON_DIR/ic_launcher.png" <<'PY'
          import sys, zipfile
          from pathlib import Path
          from PIL import Image
          archive, output = sys.argv[1], Path(sys.argv[2])
          target = "IMG_20261017_215554_512.jpg"
          with zipfile.ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n.rstrip("/").split("/")[-1] == target]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {target} in the public Dropbox folder; found {len(matches)}")
              with z.open(matches[0]) as src:
                  image = Image.open(src).convert("RGB")
                  image.thumbnail((512, 512), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (512, 512), "white")
                  canvas.paste(image, ((512-image.width)//2, (512-image.height)//2))
                  canvas.save(output, format="PNG", optimize=True)
          with Image.open(output) as check:
              if check.format != "PNG" or check.size != (512, 512):
                  raise SystemExit("Launcher icon validation failed")
          print(f"Installed and validated new launcher icon: {output}")
          PY
          rm -f "$ICON_DIR/ic_launcher.xml"
          test -s "$ICON_DIR/ic_launcher.png"
          echo "- Mishnat Yosef icon preparation: $(( $(date +%s) - PREP_START )) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Embed Mishnat Yosef release notes into the APK
        if: steps.scope.outputs.build_mishnat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREP_START=$(date +%s)
          python3 - apps/mishnat-yosef/RELEASE_NOTES.md apps/mishnat-yosef/app/src/main/res/values/strings.xml <<'PY'
          import html
          import sys
          from pathlib import Path

          source, target = map(Path, sys.argv[1:])
          text = source.read_text(encoding="utf-8").strip()
          lines = text.splitlines()
          title = lines[0].lstrip("# ").strip() if lines else ""
          details = "\n".join(lines[1:]).strip() if len(lines) > 1 else title
          if not title or not details:
              raise SystemExit("RELEASE_NOTES.md must contain a title and release details")
          # Android string resources use escaped newline sequences.
          title_xml = html.escape(title, quote=False)
          details_xml = html.escape(details.replace("\\", "\\\\").replace("\n", "\\n"), quote=False)
          target.write_text(
              '<resources>\n'
              '    <string name="app_name">משנת יוסף</string>\n'
              f'    <string name="release_notes_title">{title_xml}</string>\n'
              f'    <string name="release_notes_details">{details_xml}</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )
          print(f"Embedded release notes: {title}")
          PY
          echo "- Mishnat Yosef release-notes preparation: $(( $(date +%s) - PREP_START )) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Build selected app or all apps
        id: build_apps
        shell: bash
        env:
          APPS_TO_BUILD: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          mapfile -t APPS <<< "$APPS_TO_BUILD"
          if [[ ${#APPS[@]} -eq 0 || -z "${APPS[0]}" ]]; then echo "::error::No apps selected"; exit 1; fi
          for app in "${APPS[@]}"; do
            APP_START=$(date +%s)
            echo "::group::Building $app"
            BUILD_FILE="apps/$app/app/build.gradle"
            # Fail early with an actionable message instead of generating an unsigned APK.
            if ! grep -Eq 'signingConfig[[:space:]]+signingConfigs\.release' "$BUILD_FILE"; then
              echo "::error::Missing persistent release signing configuration in $BUILD_FILE. Add the shared APK_SIGNING_* signing block before building/publishing this app."
              exit 1
            fi
            # Keep applicationId unchanged and monotonically increase versionCode.
            CURRENT_CODE=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p" "$BUILD_FILE" | head -n1)
            if [[ -z "$CURRENT_CODE" ]]; then echo "Missing numeric versionCode in $BUILD_FILE"; exit 1; fi
            NEXT_CODE=$((CURRENT_CODE + 1))
            sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT_CODE/" "$BUILD_FILE"

            # Bump Mishnat Yosef's visible version by exactly 0.0001 on every APK build.
            # Normalize older three-decimal versions (e.g. 1.477 -> 1.4770), then
            # increment the four-decimal fractional value (e.g. 1.4770 -> 1.4771).
            # Other apps are unchanged.
            if [[ "$app" == "mishnat-yosef" ]]; then
              CURRENT_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\1/p" "$BUILD_FILE" | head -n1)
              if [[ "$CURRENT_NAME" =~ ^([0-9]+)\.([0-9]{1,4})$ ]]; then
                NAME_MAJOR="${BASH_REMATCH[1]}"
                NAME_MINOR="${BASH_REMATCH[2]}"
                NAME_MINOR=$(printf "%-4s" "$NAME_MINOR" | tr ' ' '0')
                NEXT_MINOR=$((10#$NAME_MINOR + 1))
                if (( NEXT_MINOR >= 10000 )); then
                  NAME_MAJOR=$((NAME_MAJOR + 1))
                  NEXT_MINOR=0
                fi
                NEXT_NAME=$(printf "%s.%04d" "$NAME_MAJOR" "$NEXT_MINOR")
              else
                echo "::error::Unsupported Mishnat Yosef versionName format: $CURRENT_NAME"
                exit 1
              fi
              sed -i -E "0,/versionName[[:space:]]+'[^']+'/s//versionName '$NEXT_NAME'/" "$BUILD_FILE"
              echo "Mishnat Yosef versionName: $CURRENT_NAME -> $NEXT_NAME"
            fi
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_FILE="$APK_SIGNING_STORE_FILE"
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_PASSWORD="$APK_SIGNING_STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_ALIAS="$APK_SIGNING_KEY_ALIAS"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_PASSWORD="$APK_SIGNING_KEY_PASSWORD"
            # Reuse setup-gradle's dependency cache and enable Gradle task-output caching.
            GRADLE_START=$(date +%s)
            (cd "apps/$app" && gradle --build-cache assembleRelease -x lintVitalRelease)
            GRADLE_SECONDS=$(( $(date +%s) - GRADLE_START ))
            echo "- **$app** Gradle release build: ${GRADLE_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
            APK_PATH="apps/$app/app/build/outputs/apk/release/"*.apk
            shopt -s nullglob
            APK_FILES=( $APK_PATH )
            if [[ ${#APK_FILES[@]} -ne 1 || ! -s "${APK_FILES[0]}" ]]; then
              echo "::error::Expected exactly one non-empty release APK for $app"
              exit 1
            fi
            APK_PATH="${APK_FILES[0]}"

            VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\\1/p" "$BUILD_FILE" | head -n1)
            # Verify embedded APK version and signing identity before publishing.
            # A mismatch here can make updates inconsistent or prevent upgrading an installed app.
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            APK_ANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n1)"
            APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
            if [[ -z "$APK_ANALYZER" || -z "$APK_SIGNER" ]]; then
              echo "::error::Android APK validation tools (apkanalyzer/apksigner) are unavailable."
              exit 1
            fi
            ACTUAL_CODE="$("$APK_ANALYZER" manifest version-code "$APK_PATH")"
            ACTUAL_NAME="$("$APK_ANALYZER" manifest version-name "$APK_PATH")"
            if [[ "$ACTUAL_CODE" != "$NEXT_CODE" || "$ACTUAL_NAME" != "$VERSION_NAME" ]]; then
              echo "::error::APK version mismatch: expected $VERSION_NAME ($NEXT_CODE), found $ACTUAL_NAME ($ACTUAL_CODE)."
              exit 1
            fi
            extract_cert_digest() {
              local apk="$1" output digest
              output="$("$APK_SIGNER" verify --print-certs "$apk" 2>&1)" || {
                printf '%s\n' "$output" >&2
                return 1
              }
              digest="$(printf '%s\n' "$output" | grep -i 'SHA-256 digest' | sed -E 's/.*digest:[[:space:]]*//I' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
              if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Unexpected apksigner certificate output for $apk:" >&2
                printf '%s\n' "$output" | grep -iE 'signer|digest' >&2 || true
                return 1
              fi
              printf '%s' "$digest"
            }
            NEW_CERT="$(extract_cert_digest "$APK_PATH")"
            if [[ ! "$NEW_CERT" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not verify the release APK signing certificate."
              exit 1
            fi
            PREVIOUS_APK="downloads/$app/app.apk"
            if [[ "$app" == "mishnat-yosef" && -s "$PREVIOUS_APK" ]]; then
              OLD_CERT="$(extract_cert_digest "$PREVIOUS_APK")"
              if [[ ! "$OLD_CERT" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Could not verify the previously published APK signing certificate."
                exit 1
              fi
              if [[ "$NEW_CERT" != "$OLD_CERT" ]]; then
                echo "::error::APK signing certificate changed! Refusing to publish an update that cannot upgrade the existing app. Previous: $OLD_CERT; new: $NEW_CERT"
                exit 1
              fi
              echo "Signing certificate continuity verified: $NEW_CERT"
            fi
            echo "APK manifest version verified: $ACTUAL_NAME ($ACTUAL_CODE)"

            mkdir -p "downloads/$app"
            PUBLISH_START=$(date +%s)
            cp "$APK_PATH" "downloads/$app/app.apk"

            # Preserve each successful build before the latest APK is replaced.
            HISTORY_DIR="downloads/$app/history"
            mkdir -p "$HISTORY_DIR"
            cp "$APK_PATH" "$HISTORY_DIR/${app}-v${VERSION_NAME}-code${NEXT_CODE}.apk"
            printf 'APK for %s, versionName %s, versionCode %s, built from commit %s.\n' "$app" "$VERSION_NAME" "$NEXT_CODE" "$GITHUB_SHA" > "downloads/$app/README.md"
            if [[ "$app" == "mishnat-yosef" ]]; then
              # Publish version metadata and the exact APK checksum together with every successful build.
              python3 - "$BUILD_FILE" "downloads/$app/app.apk" "apps/$app/RELEASE_NOTES.md" "downloads/$app/update.json" <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          build_file, apk_file, release_notes_file, output_file = map(Path, sys.argv[1:])
          build_text = build_file.read_text(encoding="utf-8")
          code_match = re.search(r"^\s*versionCode\s+(\d+)", build_text, re.M)
          name_match = re.search(r"^\s*versionName\s+'([^']+)'", build_text, re.M)
          if not code_match or not name_match:
              raise SystemExit("Could not read versionCode/versionName for update manifest")
          apk = apk_file.read_bytes()
          if not apk:
              raise SystemExit("Refusing to publish update metadata for an empty APK")
          release_text = release_notes_file.read_text(encoding="utf-8").strip()
          release_lines = release_text.splitlines()
          title = release_lines[0].lstrip("# ").strip() if release_lines else "עדכון אפליקציה"
          notes = "\n".join(release_lines[1:]).strip() if len(release_lines) > 1 else title
          if not title or not notes:
              raise SystemExit("RELEASE_NOTES.md must contain a title and release details")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "versionCode": int(code_match.group(1)),
              "versionName": name_match.group(1),
              "apkUrl": "https://raw.githubusercontent.com/londkirs-code/Apk-factory-/main/downloads/mishnat-yosef/app.apk",
              "sha256": hashlib.sha256(apk).hexdigest(),
              "releaseTitle": title,
              "releaseNotes": notes,
              "buildCommit": commit,
          }
          output_file.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          # Parse the generated JSON again so malformed output fails the build.
          json.loads(output_file.read_text(encoding="utf-8"))
          print(f"Published update metadata for {manifest['versionName']} ({manifest['versionCode']}); SHA-256 {manifest['sha256']}")
          PY
            fi
            echo "- **$app** APK publish preparation: $(( $(date +%s) - PUBLISH_START ))s; total app stage: $(( $(date +%s) - APP_START ))s" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          {
            echo "apps<<EOF"
            printf '%s\n' "${APPS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: downloads/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit APKs and version updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ downloads/
          if ! git diff --cached --quiet; then
            git commit -m "Build: update APKs and version codes"
            # Another push can land while Gradle is building. Rebase and retry
            # rather than failing immediately with a non-fast-forward rejection.
            for attempt in 1 2 3 4 5; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Could not rebase APK/version update onto the latest branch. Re-run the build from the latest commit."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "APK and version updates pushed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after refreshing the branch."
              sleep $((attempt * 2))
            done
            echo "::error::Could not push APK/version updates after 5 attempts."
            exit 1
          fi

      - name: Notify the triggering GitHub account
        if: success()
        uses: actions/github-script@v7
        env:
          BUILT_APPS: ${{ steps.build_apps.outputs.apps }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const apps = (process.env.BUILT_APPS || "").trim().split(/\r?\n/).filter(Boolean);
            if (!apps.length) {
              core.warning("No built apps were reported; skipping the GitHub notification.");
              return;
            }
            const links = apps.map(app =>
              `- **${app}**: https://github.com/${context.repo.owner}/${context.repo.repo}/raw/refs/heads/${process.env.BRANCH}/downloads/${app}/app.apk`
            );
            const body = [
              `✅ @${process.env.ACTOR} APK Factory finished building successfully.`,
              "",
              "Updated APK download links:",
              ...links,
              "",
              `[View this build's logs](${process.env.RUN_URL})`,
              "",
              "_This is an automated notification from APK Factory._"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
