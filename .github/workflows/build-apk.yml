name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'downloads/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    name: Build and save APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-factory-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare repository download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/app-debug.apk
          cat > downloads/README.md <<'EOF'
          # APK downloads
          The latest debug APK is generated by GitHub Actions.
          Download app-debug.apk and install it on your Android device.
          EOF

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/app-debug.apk downloads/README.md
          if git diff --cached --quiet; then
            echo "APK is unchanged; no commit needed."
          else
            git commit -m "Build: update downloadable Android APK"
            git push
          fi
