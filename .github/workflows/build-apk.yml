name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/, or all"
        required: true
        default: "all"
        type: string
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  issues: write

# Prevent overlapping builds from racing while committing APKs and versionCode updates.
concurrency:
  group: apk-factory-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare persistent signing key
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY_BASE64" || -z "$APK_SIGNING_STORE_PASSWORD" || -z "$APK_SIGNING_KEY_ALIAS" || -z "$APK_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing. Follow the one-time setup in README.md before building APKs."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/apk-factory-release.jks"
          test -s "$HOME/.android/apk-factory-release.jks"
          # Normalize accidental whitespace in the alias secret before Gradle uses it.
          APK_SIGNING_KEY_ALIAS="$(printf "%s" "$APK_SIGNING_KEY_ALIAS" | tr -d "[:space:]")"
          {
            echo "APK_SIGNING_STORE_FILE=$HOME/.android/apk-factory-release.jks"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured."
      - name: Update Mishnat Yosef launcher icon from public Dropbox folder
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="apps/mishnat-yosef/app/src/main/res/drawable"
          ZIP_FILE="$RUNNER_TEMP/mishnat-yosef-dropbox.zip"
          python3 -m pip install --quiet Pillow
          curl --fail --location --silent --show-error \
            "https://www.dropbox.com/scl/fo/rlmu5y694scuiay6340ss/AFQpDACLIS_9DRr_MTxbQ_k?rlkey=qky6haq351wfkxr9z2nekrih7&dl=1" \
            --output "$ZIP_FILE"
          python3 - "$ZIP_FILE" "$ICON_DIR/ic_launcher.png" <<'PY'
          import sys, zipfile
          from pathlib import Path
          from PIL import Image
          archive, output = sys.argv[1], Path(sys.argv[2])
          target = "IMG_20261017_215554_512.jpg"
          with zipfile.ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n.rstrip("/").split("/")[-1] == target]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {target} in the public Dropbox folder; found {len(matches)}")
              with z.open(matches[0]) as src:
                  image = Image.open(src).convert("RGB")
                  image.thumbnail((512, 512), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (512, 512), "white")
                  canvas.paste(image, ((512-image.width)//2, (512-image.height)//2))
                  canvas.save(output, format="PNG", optimize=True)
          with Image.open(output) as check:
              if check.format != "PNG" or check.size != (512, 512):
                  raise SystemExit("Launcher icon validation failed")
          print(f"Installed and validated new launcher icon: {output}")
          PY
          rm -f "$ICON_DIR/ic_launcher.xml"
          test -s "$ICON_DIR/ic_launcher.png"
      - name: Build selected app or all apps
        id: build_apps
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_APP" != "all" ]]; then
            [[ "$REQUESTED_APP" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "Invalid app id"; exit 1; }
            [[ -f "apps/$REQUESTED_APP/app/build.gradle" ]] || { echo "App not found: $REQUESTED_APP"; exit 1; }
            APPS=("$REQUESTED_APP")
          else
            mapfile -t APPS < <(find apps -mindepth 1 -maxdepth 1 -type d -print | sort | while read -r d; do [[ -f "$d/app/build.gradle" ]] && basename "$d"; done)
          fi
          if [[ ${#APPS[@]} -eq 0 ]]; then echo "No Android apps found under apps/"; exit 1; fi
          for app in "${APPS[@]}"; do
            echo "::group::Building $app"
            BUILD_FILE="apps/$app/app/build.gradle"
            # Keep applicationId unchanged and monotonically increase versionCode.
            CURRENT_CODE=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p" "$BUILD_FILE" | head -n1)
            if [[ -z "$CURRENT_CODE" ]]; then echo "Missing numeric versionCode in $BUILD_FILE"; exit 1; fi
            NEXT_CODE=$((CURRENT_CODE + 1))
            sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT_CODE/" "$BUILD_FILE"

            # Bump Mishnat Yosef's visible version on every APK build:
            # 1.2 -> 1.201 -> 1.202 -> ... . Other apps are unchanged.
            if [[ "$app" == "mishnat-yosef" ]]; then
              CURRENT_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\\"]([^'\\"]+)['\\\"].*$/\\1/p" "$BUILD_FILE" | head -n1)
              if [[ "$CURRENT_NAME" == "1.2" ]]; then
                NEXT_NAME="1.201"
              elif [[ "$CURRENT_NAME" =~ ^([0-9]+)\\.([0-9]{3,})$ ]]; then
                NAME_MAJOR="${BASH_REMATCH[1]}"
                NAME_MINOR="${BASH_REMATCH[2]}"
                NEXT_MINOR=$((10#$NAME_MINOR + 1))
                NEXT_NAME="${NAME_MAJOR}.${NEXT_MINOR}"
              else
                echo "::error::Unsupported Mishnat Yosef versionName format: $CURRENT_NAME"
                exit 1
              fi
              sed -i -E "0,/versionName[[:space:]]+['\\"][^'\\"]+['\\"]/s//versionName '$NEXT_NAME'/" "$BUILD_FILE"
              echo "Mishnat Yosef versionName: $CURRENT_NAME -> $NEXT_NAME"
            fi
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_FILE="$APK_SIGNING_STORE_FILE"
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_PASSWORD="$APK_SIGNING_STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_ALIAS="$APK_SIGNING_KEY_ALIAS"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_PASSWORD="$APK_SIGNING_KEY_PASSWORD"
            (cd "apps/$app" && gradle --no-daemon assembleRelease -x lintVitalRelease)
            APK_PATH="apps/$app/app/build/outputs/apk/release/"*.apk
            mkdir -p "downloads/$app"
            cp $APK_PATH "downloads/$app/app.apk"
            VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\\"]([^'\\"]+)['\\\"].*$/\\1/p" "$BUILD_FILE" | head -n1)
            printf 'APK for %s, versionName %s, versionCode %s, built from commit %s.\n' "$app" "$VERSION_NAME" "$NEXT_CODE" "$GITHUB_SHA" > "downloads/$app/README.md"
            echo "::endgroup::"
          done
          {
            echo "apps<<EOF"
            printf '%s\n' "${APPS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: downloads/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit APKs and version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ downloads/
          if ! git diff --cached --quiet; then
            git commit -m "Build: update APKs and version codes"
            git push
          fi

      - name: Notify the triggering GitHub account
        if: success()
        uses: actions/github-script@v7
        env:
          BUILT_APPS: ${{ steps.build_apps.outputs.apps }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const apps = (process.env.BUILT_APPS || "").trim().split(/\r?\n/).filter(Boolean);
            if (!apps.length) {
              core.warning("No built apps were reported; skipping the GitHub notification.");
              return;
            }
            const links = apps.map(app =>
              `- **${app}**: https://github.com/${context.repo.owner}/${context.repo.repo}/raw/refs/heads/${process.env.BRANCH}/downloads/${app}/app.apk`
            );
            const body = [
              `✅ @${process.env.ACTOR} APK Factory finished building successfully.`,
              "",
              "Updated APK download links:",
              ...links,
              "",
              `[View this build's logs](${process.env.RUN_URL})`,
              "",
              "_This is an automated notification from APK Factory._"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
