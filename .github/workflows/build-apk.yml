name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/, or all"
        required: true
        default: "all"
        type: string
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare persistent signing key
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY_BASE64" || -z "$APK_SIGNING_STORE_PASSWORD" || -z "$APK_SIGNING_KEY_ALIAS" || -z "$APK_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing. Follow the one-time setup in README.md before building APKs."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$APK_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/apk-factory-release.jks"
          test -s "$HOME/.android/apk-factory-release.jks"
          # Normalize accidental whitespace in the alias secret before Gradle uses it.
          APK_SIGNING_KEY_ALIAS="$(printf "%s" "$APK_SIGNING_KEY_ALIAS" | tr -d "[:space:]")"
          {
            echo "APK_SIGNING_STORE_FILE=$HOME/.android/apk-factory-release.jks"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured."
      - name: Build selected app or all apps
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_APP" != "all" ]]; then
            [[ "$REQUESTED_APP" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "Invalid app id"; exit 1; }
            [[ -f "apps/$REQUESTED_APP/app/build.gradle" ]] || { echo "App not found: $REQUESTED_APP"; exit 1; }
            APPS=("$REQUESTED_APP")
          else
            mapfile -t APPS < <(find apps -mindepth 1 -maxdepth 1 -type d -print | sort | while read -r d; do [[ -f "$d/app/build.gradle" ]] && basename "$d"; done)
          fi
          if [[ ${#APPS[@]} -eq 0 ]]; then echo "No Android apps found under apps/"; exit 1; fi
          for app in "${APPS[@]}"; do
            echo "::group::Building $app"
            BUILD_FILE="apps/$app/app/build.gradle"
            # Keep applicationId unchanged and monotonically increase versionCode.
            CURRENT_CODE=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p" "$BUILD_FILE" | head -n1)
            if [[ -z "$CURRENT_CODE" ]]; then echo "Missing numeric versionCode in $BUILD_FILE"; exit 1; fi
            NEXT_CODE=$((CURRENT_CODE + 1))
            sed -i -E "0,/versionCode[[:space:]]+[0-9]+/s//versionCode $NEXT_CODE/" "$BUILD_FILE"
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_FILE="$APK_SIGNING_STORE_FILE"
            export ORG_GRADLE_PROJECT_APK_SIGNING_STORE_PASSWORD="$APK_SIGNING_STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_ALIAS="$APK_SIGNING_KEY_ALIAS"
            export ORG_GRADLE_PROJECT_APK_SIGNING_KEY_PASSWORD="$APK_SIGNING_KEY_PASSWORD"
            (cd "apps/$app" && gradle --no-daemon assembleRelease -x lintVitalRelease)
            APK_PATH="apps/$app/app/build/outputs/apk/release/"*.apk
            mkdir -p "downloads/$app"
            cp $APK_PATH "downloads/$app/app.apk"
            printf 'APK for %s, versionCode %s, built from commit %s.\n' "$app" "$NEXT_CODE" "$GITHUB_SHA" > "downloads/$app/README.md"
            echo "::endgroup::"
          done
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: downloads/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit APKs and version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ downloads/
          if ! git diff --cached --quiet; then
            git commit -m "Build: update APKs and version codes"
            git push
          fi
